<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Sudoku Academy — Técnicas avanzadas</title>
<style>
:root{
  --ink:#0f172a; --ink2:#334155; --muted:#64748b; --line:#e2e8f0; --bg:#f1f5f9; --card:#fff;
  --sky:#0284c7; --sky-l:#e0f2fe; --indigo:#4f46e5; --green:#059669; --green-l:#d1fae5;
  --red:#dc2626; --red-l:#fee2e2; --amber:#d97706; --amber-l:#fef3c7; --violet:#9333ea; --violet-l:#f3e8ff;
  --yellow:#fef08a; --pink:#db2777; --pink-l:#fce7f3;
  --board: min(calc(100vw - 34px), 40vh);
  --lbl: 14px;
}
@supports (height:100dvh){ :root{ --board: min(calc(100vw - 34px), 40dvh); } }
body.board-S{ --board: min(calc(100vw - 34px), 32vh); }
body.board-L{ --board: min(calc(100vw - 34px), 60vh); }
@supports (height:100dvh){
  body.board-S{ --board: min(calc(100vw - 34px), 32dvh); }
  body.board-L{ --board: min(calc(100vw - 34px), 60dvh); }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);
  -webkit-tap-highlight-color:transparent;overflow:hidden;font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.35;cursor:default}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.hidden{display:none!important}

#app{height:100vh;display:flex;flex-direction:column;max-width:1200px;margin:0 auto}
@supports (height:100dvh){#app{height:100dvh}}

/* Top bar */
.top{display:flex;align-items:center;gap:8px;padding:4px 8px;background:var(--card);flex:none}
.icon-btn{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--bg);flex:none}
.icon-btn:active{background:#e2e8f0}
.ttl{flex:1;min-width:0}
.ttl .sub{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl .main{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}

/* Update banner */
.upd{flex:none;margin:0 8px 6px;padding:10px 12px;border-radius:12px;background:linear-gradient(135deg,#4f46e5,#0284c7);color:#fff;display:flex;flex-direction:column;gap:8px}
.upd .t{font-weight:800;font-size:14.5px}
.upd .d{font-size:12.5px;opacity:.95;max-height:60px;overflow:hidden;white-space:pre-line}
.upd .row a,.upd .row button{min-height:38px;border-radius:10px;font-weight:800;font-size:14px;display:inline-flex;align-items:center;justify-content:center;padding:0 12px;text-decoration:none}
.upd .row a{background:#fff;color:#4338ca;flex:1}
.upd .row button{background:rgba(255,255,255,.18);color:#fff}
/* Stage tabs */
.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:0 8px 6px;background:var(--card);border-bottom:1px solid var(--line);flex:none}
.stages button{padding:6px 2px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--muted);background:var(--bg);line-height:1.15;display:flex;align-items:center;justify-content:center;gap:4px}
.stages button .n{font-size:10px;font-weight:800;width:16px;height:16px;border-radius:50%;background:rgba(100,116,139,.15);display:inline-flex;align-items:center;justify-content:center;flex:none}
.stages button.on .n{background:rgba(255,255,255,.25)}
.stages button.on{background:var(--sky);color:#fff}
.stages button.done:not(.on){color:var(--green);background:var(--green-l)}

/* Work area */
.work{flex:1;min-height:0;display:flex;flex-direction:column}
.board-col{flex:none;display:flex;flex-direction:column;align-items:center;padding:6px 8px 2px;background:var(--bg)}
.panel-col{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--card);border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -4px 14px rgba(15,23,42,.05)}
.panel{padding:12px 14px 24px;display:flex;flex-direction:column;gap:12px}

/* Board */
.board-frame{display:grid;grid-template-columns:var(--lbl) var(--board);grid-template-rows:var(--lbl) var(--board);gap:2px}
.lbl-row,.lbl-col{display:grid;font-size:9px;color:var(--muted);font-weight:700}
.lbl-col{grid-template-columns:repeat(9,minmax(0,1fr));text-align:center;align-items:end}
.lbl-row{grid-template-rows:repeat(9,minmax(0,1fr));align-items:center;justify-items:end;padding-right:2px}
.board-wrap{position:relative;width:var(--board);height:var(--board);border:2.5px solid #1e293b;border-radius:8px;overflow:hidden;background:#fff}
.grid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));grid-template-rows:repeat(9,minmax(0,1fr));width:100%;height:100%}
.cell{position:relative;min-width:0;min-height:0;overflow:hidden;border-right:1px solid #cbd5e1;border-bottom:1px solid #cbd5e1;display:flex;align-items:center;justify-content:center;background:#fff;cursor:pointer;user-select:none;-webkit-user-select:none}
.cell.br{border-right:2px solid #1e293b}.cell.bb{border-bottom:2px solid #1e293b}
.cell.c8{border-right:0}.cell.r8{border-bottom:0}
.cell.alt{background:#f8fafc}
.cell.peer{background:#f0f7ff}
.cell.zone{background:#e0f2fe}
.cell.sel{box-shadow:inset 0 0 0 2.5px var(--sky);z-index:4}
.cell.picked{background:var(--yellow)!important;box-shadow:inset 0 0 0 2.5px #ca8a04;z-index:3}
.cell.role-pattern,.cell.role-base,.cell.role-alsA,.cell.role-colorA{background:#cfeafd!important;box-shadow:inset 0 0 0 2px var(--sky)}
.cell.role-pivot{background:var(--amber-l)!important;box-shadow:inset 0 0 0 2.5px var(--amber)}
.cell.role-pincer{background:var(--green-l)!important;box-shadow:inset 0 0 0 2px var(--green)}
.cell.role-roof,.cell.role-bridge,.cell.role-alsB,.cell.role-colorB{background:var(--violet-l)!important;box-shadow:inset 0 0 0 2px var(--violet)}
.cell.role-fin{background:var(--pink-l)!important;box-shadow:inset 0 0 0 2.5px var(--pink)}
.cell.role-target{background:var(--red-l)!important;box-shadow:inset 0 0 0 2px var(--red)}
.cell.role-single{background:#bbf7d0!important;box-shadow:inset 0 0 0 3px #16a34a}
.cell.sel.picked,.cell.sel[class*="role-"]{box-shadow:inset 0 0 0 3px var(--sky)}
.v{font-size:calc(var(--board) / 16);font-weight:800;line-height:1}
.v.given{color:var(--ink)}
.v.placed{color:var(--sky)}
.cands{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));width:100%;height:100%;padding:1px;pointer-events:none}
.cd{display:flex;align-items:center;justify-content:center;font-size:calc(var(--board) / 31);font-weight:650;color:#475569;line-height:1;border-radius:3px}
.cd.f{background:var(--sky);color:#fff;font-weight:800}
.cd.p{background:var(--green);color:#fff;font-weight:800}
.cd.t{background:var(--red);color:#fff;font-weight:800;text-decoration:line-through}
.cd.x{color:#16a34a;text-decoration:line-through;opacity:.55}
.svg-ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}

.filterbar{display:grid;grid-template-columns:auto repeat(9,1fr) auto;gap:3px;align-items:center;width:calc(var(--board) + var(--lbl) + 2px);padding-top:5px}
.filterbar .fl{font-size:10.5px;font-weight:700;color:var(--muted);padding-right:2px;line-height:1.1}
.filterbar button{height:30px;border-radius:8px;background:#fff;border:1.5px solid #cbd5e1;font-weight:800;font-size:15px;color:var(--ink2)}
.filterbar button.on{background:var(--sky);border-color:var(--sky);color:#fff}
.filterbar button.full{opacity:.35}
.filterbar button.clr{padding:0 8px;font-size:13px}
.cell.same{background:#bfdbfe!important}
.cell.same .v{color:#1d4ed8}
.legend{display:flex;gap:10px;flex-wrap:nowrap;overflow-x:auto;width:calc(var(--board) + var(--lbl) + 2px);padding:5px 0 1px;font-size:11px;color:var(--ink2);scrollbar-width:none;min-height:22px}
.legend::-webkit-scrollbar{display:none}
.legend span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;flex:none}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;border:1.5px solid}

/* Dock (bottom) */
.dock{flex:none;background:var(--card);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}
.dock:empty{display:none}
.row{display:flex;gap:8px;align-items:center}
.pad{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.pad button{height:46px;border-radius:10px;background:var(--bg);border:1px solid #cbd5e1;font-weight:800;font-size:19px}
.pad button:not(:disabled):active{background:var(--sky);color:#fff}
.pad.place button{color:var(--sky)}
.pad-hint{font-size:11.5px;color:var(--muted);text-align:center}

.btn{min-height:46px;padding:10px 14px;border-radius:12px;font-weight:750;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn.pri{background:var(--sky);color:#fff}
.btn.ok{background:var(--green);color:#fff}
.btn.ind{background:var(--indigo);color:#fff}
.btn.sec{background:var(--bg);color:var(--ink2);border:1px solid #cbd5e1}
.btn.ghost{background:transparent;color:var(--sky);padding:8px 10px;min-height:40px}
.btn.sm{min-height:38px;padding:7px 11px;font-size:13.5px;border-radius:10px}
.grow{flex:1}

/* Panel content */
.kicker{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--sky)}
.h2{font-size:18px;font-weight:800;line-height:1.25}
.p{font-size:15px;color:var(--ink2)}
.small{font-size:12.5px;color:var(--muted)}
.box{border-radius:12px;padding:11px 13px;border:1px solid var(--line);background:#fff}
.box.blue{background:#f0f9ff;border-color:#bae6fd}
.box.amber{background:#fffbeb;border-color:#fde68a}
.box.green{background:#f0fdf4;border-color:#bbf7d0}
.box.red{background:#fef2f2;border-color:#fecaca}
.box.violet{background:#faf5ff;border-color:#e9d5ff}
.box b.t{display:block;font-size:13px;margin-bottom:3px}
.msg{border-radius:12px;padding:10px 12px;font-size:14px;display:flex;gap:8px;align-items:flex-start;animation:pop .25s ease}
.msg.success{background:#dcfce7;color:#14532d}
.msg.error{background:#fee2e2;color:#7f1d1d}
.msg.warn{background:#fef3c7;color:#78350f}
.msg.info{background:#e0f2fe;color:#0c4a6e}
.msg .x{margin-left:auto;font-weight:800;opacity:.6;padding:0 4px}
@keyframes pop{from{transform:translateY(-4px);opacity:.3}to{transform:none;opacity:1}}
details.box{padding:0}
details.box summary{list-style:none;padding:11px 13px;font-weight:750;font-size:14.5px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
details.box summary::-webkit-details-marker{display:none}
details.box summary::after{content:"＋";color:var(--muted);font-weight:800}
details.box[open] summary::after{content:"－"}
details.box .in{padding:0 13px 12px;font-size:14.5px;color:var(--ink2)}

.progress{display:flex;gap:4px}
.progress i{flex:1;height:5px;border-radius:3px;background:#e2e8f0}
.progress i.on{background:var(--sky)}
.progress i.ok{background:var(--green)}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{text-align:left;padding:12px 13px;border-radius:12px;border:1.5px solid #cbd5e1;background:#fff;font-weight:650;font-size:14.5px;min-height:48px;line-height:1.35}
.choice:active{background:#f0f9ff}
.choice.right{border-color:var(--green);background:#f0fdf4}
.choice.wrong{border-color:var(--red);background:#fef2f2}
.digits{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.digits button{height:44px;border-radius:10px;border:1.5px solid #cbd5e1;font-weight:800;font-size:18px;background:#fff}
.digits button.wrong{border-color:var(--red);background:#fef2f2;color:var(--red)}
.donelist{display:flex;flex-direction:column;gap:4px}
.donelist div{font-size:13px;color:#166534;display:flex;gap:6px}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--ink2)}
.chip.g{background:var(--green-l);color:#065f46}.chip.b{background:var(--sky-l);color:#075985}.chip.a{background:var(--amber-l);color:#92400e}
.links{display:flex;flex-wrap:wrap;gap:4px 10px}
.steps-dots{display:flex;gap:5px;justify-content:center}
.steps-dots button{width:30px;height:30px;border-radius:50%;font-size:12px;font-weight:800;background:var(--bg);color:var(--muted)}
.steps-dots button.on{background:var(--indigo);color:#fff}
.steps-dots button.seen{background:#e0e7ff;color:var(--indigo)}

/* Menu screen */
.screen{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column}
.screen .top{position:sticky;top:0}
.screen .body{flex:1;overflow-y:auto;padding:12px 12px 40px;display:flex;flex-direction:column;gap:14px;max-width:760px;width:100%;margin:0 auto}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#e2e8f0;padding:4px;border-radius:12px}
.seg button{padding:8px;border-radius:9px;font-weight:750;font-size:14px;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.lvl{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.lvl-h{padding:12px 14px;border-bottom:1px solid var(--line)}
.lvl-h .h{font-weight:800;font-size:15.5px}
.tech{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid #f1f5f9;width:100%;text-align:left}
.tech:last-child{border-bottom:0}
.tech:active{background:#f8fafc}
.tech .num{width:28px;height:28px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--muted);flex:none}
.tech.cur .num{background:var(--sky);color:#fff}
.tech .nm{font-weight:750;font-size:14.5px;line-height:1.25}
.tech .ct{font-size:11.5px;color:var(--muted)}
.dots{display:flex;gap:3px;margin-top:3px}
.dots i{width:16px;height:4px;border-radius:2px;background:#e2e8f0}
.dots i.on{background:var(--green)}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .k{font-size:11.5px;color:var(--muted)}
.stat .val{font-size:22px;font-weight:800}
.free-card{background:linear-gradient(135deg,#4f46e5,#0284c7);color:#fff;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.free-card .btn{background:#fff;color:var(--indigo)}

/* Wide screens: board left, explanation right */
@media (min-width:880px){
  :root,body.board-S,body.board-L{--board:min(560px, calc(100vh - 200px))}
  @supports (height:100dvh){:root,body.board-S,body.board-L{--board:min(560px, calc(100dvh - 200px))}}
  .work{flex-direction:row}
  .board-col{padding:16px}
  .panel-col{border-radius:16px;margin:16px 16px 16px 0;border:1px solid var(--line)}
  #boardSizeBtn{display:none}
}

</style>
</head>
<body>
<div id="app">
  <header class="top">
    <button id="menuBtn" class="icon-btn" aria-label="Abrir mapa de técnicas">☰</button>
    <div class="ttl">
      <div class="sub" id="techSub">Nivel 1 · Técnica 1 de 23</div>
      <div class="main" id="techTitle">Sudoku Academy</div>
    </div>
    <button id="boardSizeBtn" class="icon-btn" aria-label="Cambiar tamaño del tablero" title="Tamaño del tablero">⤢</button>
  </header>

  <div id="updBar" class="upd hidden" role="status"></div>
  <nav class="stages" id="stageTabs" aria-label="Etapas de la lección">
    <button data-tab="A"><span class="n">1</span>Entender</button>
    <button data-tab="B"><span class="n">2</span>Ejemplo</button>
    <button data-tab="C"><span class="n">3</span>Practicar</button>
    <button data-tab="D"><span class="n">4</span>Evaluarme</button>
  </nav>

  <main class="work">
    <section class="board-col">
      <div class="board-frame">
        <div></div>
        <div class="lbl-col" id="lblCol"></div>
        <div class="lbl-row" id="lblRow"></div>
        <div class="board-wrap">
          <div id="grid" class="grid"></div>
          <svg id="overlay" class="svg-ov" viewBox="0 0 900 900" preserveAspectRatio="none"></svg>
        </div>
      </div>
      <div class="filterbar" id="filterBar" aria-label="Resaltar un número"></div>
      <div class="legend" id="legend"></div>
    </section>
    <section class="panel-col" id="panelCol">
      <div class="panel" id="panel"></div>
    </section>
  </main>

  <footer class="dock" id="dock"></footer>
</div>

<div id="menu" class="screen hidden" role="dialog" aria-label="Mapa de técnicas">
  <header class="top">
    <button id="menuClose" class="icon-btn" aria-label="Cerrar">✕</button>
    <div class="ttl"><div class="sub">Sudoku Academy</div><div class="main">Mapa de técnicas</div></div>
  </header>
  <div class="body">
    <div class="seg"><button data-mtab="map" class="on">Técnicas</button><button data-mtab="stats">Mi progreso</button></div>
    <div id="menuMap"></div>
    <div id="menuStats" class="hidden"></div>
  </div>
</div>

    const TECHNIQUE_META = {"locked_candidates":{"id":"locked_candidates","order":1,"level":1,"name":"Locked Candidates (Pointing & Claiming)","shortName":"Locked Candidates","category":"Intersecciones Línea-Región","concept":"Cuando dentro de una región 3×3 todas las apariciones de un candidato están confinadas a una misma fila o columna (Pointing), ese candidato debe ocupar una de esas celdas y puede eliminarse del resto de la fila o columna fuera de la región. De forma inversa (Claiming), si en una fila o columna todas las apariciones de un candidato caen dentro de una sola región 3×3, se elimina del resto de dicha región.","whyItWorks":"Cada región 3×3 y cada línea necesitan contener el dígito exactamente una vez. Si la intersección entre ambas concentra todas las opciones de una de las dos unidades, bloquea el dígito para la otra unidad.","patternTip":"Busca un dígito que dentro de una caja 3×3 solo aparezca alineado en una fila o columna, o que en una fila/columna solo exista dentro de una misma caja.","problemSolved":"Desbloquea tableros donde ningún dígito tiene una posición única directa (Single), pero dentro de una caja 3×3 o de una línea todas las opciones de un número están concentradas en la intersección compartida.","purpose":"Reducir candidatos en una fila, columna o región 3×3 aprovechando la interacción obligatoria entre una caja y una línea que la atraviesa.","whenToUse":"Al inicio del análisis avanzado, justo cuando se agotan los Naked Singles y Hidden Singles.","conditions":"1) En Pointing: todas las apariciones de un candidato D dentro de una región 3×3 (2 o 3 celdas) deben estar en la misma fila o columna. 2) En Claiming: todas las apariciones de D dentro de una fila o columna deben caer dentro de una única región 3×3.","howToRecognize":"Elige un dígito del 1 al 9 y observa cada región 3×3: si sus candidatos forman una línea recta horizontal o vertical dentro de la caja, tienes un Pointing. Si en toda una fila o columna ese dígito solo aparece dentro de una caja, tienes un Claiming.","whatAndWhyEliminate":"En Pointing se elimina D del resto de esa fila o columna fuera de la caja. En Claiming se elimina D del resto de la caja fuera de esa fila o columna, porque la intersección absorberá forzosamente el dígito D.","whenNotToApply":"No se puede aplicar si dentro de la unidad de origen existe aunque sea una sola celda adicional con el candidato D fuera de la intersección de 3 celdas.","prereqConcepts":"Reglas básicas de fila, columna y región 3×3; concepto de intersección línea-caja (3 celdas compartidas)."},"naked_pairs":{"id":"naked_pairs","order":2,"level":1,"name":"Naked Pairs (Pares Desnudos)","shortName":"Naked Pairs","category":"Subconjuntos Desnudos","concept":"Dos celdas dentro de una misma unidad (fila, columna o región 3×3) que contienen exactamente los mismos dos candidatos {X, Y} y ningún otro. Como una de ellas será X y la otra será Y, ninguna otra celda de esa unidad puede contener X ni Y.","whyItWorks":"Por el principio del palomar, 2 dígitos exclusivos repartidos en 2 celdas saturan ambas posiciones: cualquier aparición de esos dos dígitos en el resto de la unidad llevaría a dejar una de las dos celdas vacía.","patternTip":"Escanea una fila, columna o caja buscando dos celdas bivaluadas idénticas {a, b}.","problemSolved":"Elimina candidatos redundantes en una fila, columna o región cuando dos celdas han quedado reducidas exactamente a los mismos dos números posibles.","purpose":"Bloquear dos dígitos {X, Y} dentro de dos celdas específicas para limpiar esos dos candidatos del resto de las celdas de la misma unidad.","whenToUse":"Siempre que observes celdas bivaluadas (con solo 2 candidatos) que compartan fila, columna o región 3×3.","conditions":"Dos celdas vacías dentro de la misma unidad (fila, columna o caja) deben contener exactamente los mismos dos candidatos {X, Y} y ningún candidato adicional.","howToRecognize":"Busca celdas con solo 2 notas en una misma fila, columna o región. Si encuentras dos casillas con el mismo par exacto (por ejemplo {3,7} y {3,7}), forman un Naked Pair.","whatAndWhyEliminate":"Se eliminan X e Y de todas las demás celdas de esa fila, columna o región (y si comparten tanto caja como línea, de ambas unidades), porque una de las dos celdas será X y la otra será Y.","whenNotToApply":"No aplica si una de las dos celdas tiene un tercer candidato (ej. {3,7} y {3,7,9}) o si las dos celdas no comparten ninguna unidad común.","prereqConcepts":"Candidatos de celda (celdas bivaluadas) y unidades compartidas."},"hidden_pairs":{"id":"hidden_pairs","order":3,"level":1,"name":"Hidden Pairs (Pares Ocultos)","shortName":"Hidden Pairs","concept":"Cuando dos dígitos {X, Y} dentro de una unidad aparecen únicamente en las mismas dos celdas (aunque esas celdas tengan otros candidatos adicionales), esos dos dígitos deben ocupar forzosamente dichas dos celdas. Por tanto, todos los demás candidatos presentes en esas dos celdas quedan eliminados.","category":"Subconjuntos Ocultos","whyItWorks":"Si cualquiera de las dos celdas tomara un tercer candidato distinto de X e Y, quedaría solo una celda disponible para alojar tanto a X como a Y en la unidad, lo cual es imposible.","patternTip":"Cuenta en qué celdas de una unidad aparecen los dígitos del 1 al 9: si dos dígitos distintos comparten exactamente las mismas dos únicas posiciones, tienes un Par Oculto.","problemSolved":"Permite limpiar celdas congestionadas con muchos candidatos descubriendo que dos dígitos solo pueden vivir en esas dos casillas dentro de una unidad.","purpose":"Reducir dos celdas de múltiples candidatos a un par limpio {X, Y} eliminando todos los demás candidatos presentes en esas dos celdas.","whenToUse":"Cuando el tablero tiene muchas notas por celda y no se ven pares desnudos a simple vista.","conditions":"Dentro de una misma fila, columna o región, dos dígitos distintos X e Y deben aparecer como candidatos únicamente en las mismas dos celdas (2 apariciones cada uno, en las mismas 2 posiciones).","howToRecognize":"Escanea una unidad contando en cuántas celdas aparece cada dígito del 1 al 9. Si dos dígitos distintos aparecen solo en las mismas dos celdas (por ejemplo, 4 y 8 solo están en F2C1 y F2C6), forman un Hidden Pair.","whatAndWhyEliminate":"Se eliminan todos los candidatos distintos de X e Y dentro de esas dos celdas únicamente, porque si cualquiera de ellas tomara otro número no habría espacio para colocar tanto X como Y en la unidad.","whenNotToApply":"No elimines X ni Y de otras celdas (ya no están allí), ni apliques la regla si uno de los dos dígitos aparece en una tercera celda de la unidad.","prereqConcepts":"Frecuencia de un candidato en una unidad y diferencia entre subconjunto desnudo y oculto."},"naked_triples":{"id":"naked_triples","order":4,"level":1,"name":"Naked Triples (Tríos Desnudos)","shortName":"Naked Triples","category":"Subconjuntos Desnudos","concept":"Tres celdas de una misma unidad cuyos candidatos combinados forman un conjunto de exactamente tres dígitos {X, Y, Z} (cada celda puede tener 2 o 3 de esos dígitos, como {X,Y}, {Y,Z}, {X,Z}). Esos tres dígitos quedan bloqueados en esas tres celdas y se eliminan del resto de la unidad.","whyItWorks":"Tres celdas que solo admiten candidatos del subconjunto {X, Y, Z} deben repartirse los tres valores uno a uno. Ninguna otra celda de la unidad puede tomar X, Y ni Z.","patternTip":"No busques solo tres celdas idénticas {X,Y,Z}: la forma más frecuente son tres celdas bivaluadas encadenadas {X,Y}, {Y,Z} y {X,Z} en la misma unidad.","problemSolved":"Desbloquea unidades donde no hay pares desnudos, pero tres celdas se reparten de forma exclusiva tres dígitos posibles.","purpose":"Bloquear tres candidatos {X, Y, Z} en tres celdas de una unidad para eliminarlos del resto de casillas de dicha unidad.","whenToUse":"Cuando en una fila, columna o caja hay varias celdas con 2 o 3 candidatos cuyos números se solapan entre sí.","conditions":"Tres celdas de una misma unidad deben tener candidatos que sean subconjuntos de un conjunto de exactamente tres dígitos {X, Y, Z} (cada celda con al menos 2 candidatos, sin ningún dígito fuera de {X, Y, Z}).","howToRecognize":"Busca tres celdas en una unidad cuya unión total de candidatos sea de solo 3 números: por ejemplo {1,2,3}, {1,2}, {2,3} o incluso tres bivaluadas encadenadas {1,2}, {2,3} y {1,3}.","whatAndWhyEliminate":"Se eliminan los tres dígitos X, Y y Z de todas las demás celdas de esa misma fila, columna o región, ya que las tres celdas del trío absorberán obligatoriamente a X, Y y Z.","whenNotToApply":"No se aplica si la unión de candidatos de las tres celdas suma 4 dígitos (ej. {1,2}, {2,3}, {3,4} tiene 4 dígitos: {1,2,3,4}).","prereqConcepts":"Naked Pairs y unión de conjuntos de candidatos."},"hidden_triples":{"id":"hidden_triples","order":5,"level":1,"name":"Hidden Triples (Tríos Ocultos)","shortName":"Hidden Triples","category":"Subconjuntos Ocultos","concept":"Tres dígitos {X, Y, Z} que dentro de una fila, columna o región solo aparecen en un mismo grupo de tres celdas. Esas tres celdas quedan reservadas para {X, Y, Z}, permitiendo eliminar cualquier otro candidato adicional dentro de ellas.","whyItWorks":"Los tres dígitos necesitan tres celdas distintas en la unidad; como solo existen tres celdas capaces de alojarlos, ningún otro número puede ocupar esas tres casillas.","patternTip":"Busca tres dígitos que en una unidad estén restringidos a solo 2 o 3 posiciones cuya unión sea exactamente de tres celdas.","problemSolved":"Descubre tres celdas reservadas para tres dígitos específicos cuando dichos dígitos están ocultos entre muchos otros candidatos de la unidad.","purpose":"Eliminar todos los candidatos extra dentro de tres celdas de una unidad, reduciéndolas exclusivamente al trío {X, Y, Z}.","whenToUse":"En unidades con muchas celdas vacías donde tres dígitos tienen cada uno solo 2 o 3 posiciones posibles que coinciden entre sí.","conditions":"Dentro de una fila, columna o región, tres dígitos {X, Y, Z} no deben aparecer en ninguna otra celda fuera de las mismas tres casillas {C1, C2, C3}.","howToRecognize":"Localiza en una unidad los dígitos que aparecen solo 2 o 3 veces. Si encuentras tres dígitos cuyas posiciones posibles quedan todas contenidas dentro de las mismas tres celdas, tienes un Hidden Triple.","whatAndWhyEliminate":"Se eliminan de las tres celdas {C1, C2, C3} todos los candidatos que NO sean X, Y ni Z, porque esas tres casillas están obligadas a alojar a X, Y y Z.","whenNotToApply":"No aplica si alguno de los tres dígitos tiene una cuarta aparición en otra celda de la misma unidad.","prereqConcepts":"Hidden Pairs y Naked Triples."},"x_wing":{"id":"x_wing","order":6,"level":2,"name":"X-Wing","shortName":"X-Wing","category":"Patrones Fish (Tamaño 2)","concept":"Para un mismo dígito X, existen dos filas (conjuntos base) donde X solo puede ir en las mismas dos columnas (conjuntos de cobertura), formando las cuatro esquinas de un rectángulo. Como X debe ocupar una esquina en cada fila en columnas opuestas, se elimina X del resto de ambas columnas (y viceversa si la base son dos columnas).","whyItWorks":"En un rectángulo de 4 vértices con enlaces fuertes en las dos filas base, los dos valores verdaderos de X quedan forzados en una de las dos diagonales del rectángulo, cubriendo ambas columnas.","patternTip":"Activa el filtro de un dígito del 1 al 9 y busca dos filas donde el dígito aparezca solo dos veces y esté alineado en las mismas dos columnas.","problemSolved":"Resuelve bloqueos donde el análisis de una sola fila, columna o caja ya no produce eliminaciones, conectando dos líneas paralelas mediante un mismo dígito.","purpose":"Cruzar la restricción de dos filas (bases) hacia dos columnas (coberturas) —o viceversa— formando un rectángulo lógico de 4 esquinas.","whenToUse":"Cuando un dígito aparece exactamente 2 veces (par conjugado) en varias filas o en varias columnas.","conditions":"Para un mismo candidato D, deben existir 2 filas donde D aparezca únicamente en 2 celdas, y esas celdas deben estar alineadas exactamente en las mismas 2 columnas (o 2 columnas alineadas en las mismas 2 filas).","howToRecognize":"Activa el filtro de un dígito D. Busca dos filas que tengan solo 2 candidatos de D cada una; si sus posiciones caen exactamente una debajo de la otra formando las 4 esquinas de un rectángulo, es un X-Wing.","whatAndWhyEliminate":"Si la base son 2 filas, se elimina D de todas las demás celdas de las 2 columnas del rectángulo (porque en las dos filas base, D ocupará dos esquinas diagonalmente opuestas, cubriendo ambas columnas).","whenNotToApply":"No se aplica si una de las dos filas base tiene una tercera aparición de D, o si eliminas en las filas base en lugar de en las columnas de cobertura.","prereqConcepts":"Pares conjugados (enlace fuerte donde un dígito solo tiene 2 posiciones en una línea)."},"swordfish":{"id":"swordfish","order":7,"level":2,"name":"Swordfish","shortName":"Swordfish","category":"Patrones Fish (Tamaño 3)","concept":"Generalización del X-Wing a 3 filas y 3 columnas: si para un dígito X existen 3 filas donde todas las apariciones de X (2 o 3 por fila) caen dentro de las mismas 3 columnas, entonces esas 3 columnas quedan cubiertas por las 3 filas y se elimina X de cualquier otra celda en esas 3 columnas.","whyItWorks":"Tres filas requieren colocar tres veces el dígito X. Al estar todas sus opciones confinadas en tres columnas, cada una de esas tres columnas recibirá exactamente un X procedente de las tres filas base.","patternTip":"No es necesario que cada fila tenga los 3 candidatos: basta con que cada una tenga 2 o 3 posiciones cuya unión total sea de exactamente 3 columnas.","problemSolved":"Extiende el principio del X-Wing cuando un dígito no se limita a 2 posiciones en 2 líneas, sino que se distribuye en 3 líneas base y 3 líneas perpendiculares.","purpose":"Bloquear un candidato D en 3 columnas a partir de 3 filas base (o en 3 filas a partir de 3 columnas base).","whenToUse":"Cuando para un dígito D existen varias filas o columnas que contienen solo 2 o 3 apariciones de D.","conditions":"Para un dígito D, existen 3 filas base tales que todas las apariciones de D en esas 3 filas (2 o 3 por fila) caen dentro de un conjunto común de exactamente 3 columnas (o viceversa).","howToRecognize":"Filtra un dígito D y busca 3 filas que tengan solo 2 o 3 candidatos de D. Comprueba en qué columnas caen: si entre las 3 filas solo tocan las mismas 3 columnas en total, forman un Swordfish.","whatAndWhyEliminate":"Se elimina D de cualquier otra celda de las 3 columnas de cobertura que no pertenezca a las 3 filas base, porque las 3 filas base colocarán tres ejemplares de D repartidos uno en cada una de las 3 columnas.","whenNotToApply":"No se puede aplicar si las 3 filas base tocan en total 4 columnas distintas, o si una de las filas base tiene candidatos de D fuera de las 3 columnas.","prereqConcepts":"X-Wing y concepto de conjuntos base vs. conjuntos de cobertura."},"jellyfish":{"id":"jellyfish","order":8,"level":2,"name":"Jellyfish","shortName":"Jellyfish","category":"Patrones Fish (Tamaño 4)","concept":"Patrón Fish de orden 4: para un dígito X, existen 4 filas (o columnas) cuyas apariciones del candidato X se distribuyen exclusivamente sobre las mismas 4 columnas (o filas). El candidato X se elimina de todas las demás celdas de las 4 líneas de cobertura.","whyItWorks":"Cuatro conjuntos base independientes que solo disponen de cuatro conjuntos de cobertura bloquean biunívocamente un ejemplar del dígito en cada línea de cobertura.","patternTip":"Filtra por dígito y localiza cuatro filas que solo tengan candidatos en un subconjunto común de cuatro columnas.","problemSolved":"Desbloquea estructuras globales de un solo dígito de tamaño 4×4 cuando ni X-Wing (2×2) ni Swordfish (3×3) están presentes.","purpose":"Aislar un candidato D en 4 líneas base alineadas sobre 4 líneas perpendiculares de cobertura.","whenToUse":"En tableros avanzados cuando un dígito D tiene entre 2 y 4 apariciones en cuatro filas (o cuatro columnas).","conditions":"Para un candidato D, deben existir 4 filas donde todas las celdas con D pertenezcan exclusivamente a las mismas 4 columnas (o 4 columnas restringidas a las mismas 4 filas).","howToRecognize":"Filtra por dígito D y localiza 4 filas que tengan un máximo de 4 candidatos cada una. Si la unión de las columnas donde aparece D en esas 4 filas suma exactamente 4 columnas, es un Jellyfish.","whatAndWhyEliminate":"Se elimina D del resto de las celdas en las 4 líneas de cobertura fuera de las 4 líneas base, pues cada una de las 4 líneas de cobertura recibirá un D de una línea base.","whenNotToApply":"No aplica si las 4 líneas base abarcan 5 líneas perpendiculares o si se confunden las líneas base con las de cobertura.","prereqConcepts":"X-Wing y Swordfish."},"xy_wing":{"id":"xy_wing","order":9,"level":2,"name":"XY-Wing (Y-Wing)","shortName":"XY-Wing","category":"Alas de Pivote","concept":"Una celda pivote bivaluada {X, Y} ve a dos celdas pinza bivaluadas: una con {X, Z} y otra con {Y, Z}. Sea cual sea el valor del pivote (X o Y), una de las dos pinzas estará obligada a tomar el valor Z. Por tanto, cualquier celda que vea simultáneamente a ambas pinzas no puede contener Z.","whyItWorks":"Si el pivote es X, la primera pinza {X,Z} debe ser Z; si el pivote es Y, la segunda pinza {Y,Z} debe ser Z. En ambos casos posibles, Z es verdadero en al menos una pinza.","patternTip":"Busca tres celdas bivaluadas con candidatos {X,Y}, {X,Z} y {Y,Z} donde {X,Y} comparta unidad con las otras dos.","problemSolved":"Supera bloqueos donde ningún dígito individual forma un patrón Fish, encadenando tres celdas bivaluadas con tres dígitos distintos {X, Y, Z}.","purpose":"Utilizar una celda pivote {X, Y} y dos celdas pinza {X, Z} y {Y, Z} para garantizar que al menos una de las dos pinzas contenga el dígito Z.","whenToUse":"Cuando abundan celdas bivaluadas (de 2 candidatos) interconectadas en filas, columnas y cajas.","conditions":"1) Una celda pivote bivaluada {X, Y}. 2) Dos celdas pinza bivaluadas {X, Z} y {Y, Z} que sean vistas por el pivote (compartan fila, columna o caja con él). 3) Tres dígitos distintos X, Y, Z.","howToRecognize":"Busca una celda con 2 candidatos {X, Y}. Inspecciona su fila, columna y región buscando una vecina {X, Z} y otra vecina {Y, Z} que compartan un tercer dígito común Z.","whatAndWhyEliminate":"Se elimina el candidato Z de cualquier celda del tablero que vea simultáneamente a AMBAS pinzas ({X, Z} e {Y, Z}), porque tanto si el pivote es X como si es Y, una de las dos pinzas será forzosamente Z.","whenNotToApply":"No elimines Z de celdas que vean al pivote pero no a ambas pinzas; tampoco aplica si alguna de las tres celdas tiene 3 candidatos (eso requeriría un XYZ-Wing).","prereqConcepts":"Celdas bivaluadas e intersección de pares (peers comunes a dos celdas)."},"xyz_wing":{"id":"xyz_wing","order":10,"level":2,"name":"XYZ-Wing","shortName":"XYZ-Wing","category":"Alas de Pivote","concept":"Un pivote trivaluado {X, Y, Z} ve a dos pinzas bivaluadas {X, Z} y {Y, Z}. Al menos una de las tres celdas (el pivote o una de las dos pinzas) debe contener Z. En consecuencia, cualquier celda externa que vea simultáneamente a las TRES celdas del patrón no puede contener Z.","whyItWorks":"El pivote {X,Y,Z} solo tiene tres opciones: si es Z, elimina Z de sus pares; si es X, fuerza Z en la pinza {X,Z}; si es Y, fuerza Z en la pinza {Y,Z}.","patternTip":"Una de las pinzas suele estar en la misma caja 3×3 que el pivote {X,Y,Z} y la otra en la misma fila o columna, restringiendo las eliminaciones a la intersección dentro de la caja del pivote.","problemSolved":"Resuelve configuraciones similares al XY-Wing cuando la celda pivote contiene también el propio candidato de eliminación Z ({X, Y, Z}).","purpose":"Forzar que el dígito Z esté en el pivote {X, Y, Z} o en una de sus dos pinzas {X, Z} e {Y, Z}.","whenToUse":"Cuando una celda trivaluada {X, Y, Z} comparte caja y línea con dos celdas bivaluadas {X, Z} e {Y, Z}.","conditions":"1) Un pivote con 3 candidatos {X, Y, Z}. 2) Dos pinzas bivaluadas {X, Z} e {Y, Z} que vean al pivote. 3) La celda objetivo debe ver a las TRES celdas del patrón (pivote y ambas pinzas).","howToRecognize":"Localiza una celda con 3 candidatos {X, Y, Z} y busca dos celdas bivaluadas {X, Z} e {Y, Z} que sean subconjuntos de ella: una dentro de la misma caja del pivote y otra en la misma fila o columna.","whatAndWhyEliminate":"Se elimina Z únicamente de las celdas que ven simultáneamente al pivote {X, Y, Z} y a las dos pinzas {X, Z} e {Y, Z}, ya que cualquiera de los tres valores posibles del pivote garantiza un Z en una de esas tres casillas.","whenNotToApply":"A diferencia del XY-Wing, NO puedes eliminar Z de una celda que vea solo a las dos pinzas pero NO vea al pivote, porque el propio pivote podría ser quien tome el valor Z.","prereqConcepts":"XY-Wing e intersección de línea y caja."},"w_wing":{"id":"w_wing","order":11,"level":2,"name":"W-Wing","shortName":"W-Wing","category":"Alas con Enlace Fuerte","concept":"Dos celdas bivaluadas idénticas {X, Y} que no se ven entre sí están conectadas por un enlace fuerte (par conjugado) del dígito X en alguna fila, columna o región. Como los dos extremos del enlace fuerte no pueden ser ambos falsos para X, las dos celdas {X, Y} no pueden ser ambas X, por lo que al menos una de ellas es Y. Se elimina Y de toda celda que vea a ambas.","whyItWorks":"En el par conjugado S1==S2 sobre X, al menos uno contiene X. Si S1=X, la primera pinza {X,Y} que ve a S1 debe ser Y; si S2=X, la segunda pinza {X,Y} que ve a S2 debe ser Y.","patternTip":"Localiza dos celdas bivaluadas gemelas {X,Y} en distintas zonas del tablero y busca un par conjugado de X o de Y que conecte con ambas.","problemSolved":"Conecta dos celdas bivaluadas idénticas {X, Y} que están lejos entre sí (no se ven) mediante un par conjugado intermedio.","purpose":"Demostrar que dos celdas gemelas {X, Y} no pueden tomar ambas el valor X, forzando que al menos una de ellas sea Y.","whenToUse":"Cuando existen dos celdas bivaluadas con el mismo par {X, Y} en distintas zonas del tablero.","conditions":"1) Dos celdas bivaluadas {X, Y} que no se ven entre sí. 2) Una unidad (fila, columna o región) con un enlace fuerte (solo 2 apariciones) sobre X, cuyos dos extremos vean respectivamente a cada una de las dos celdas {X, Y}.","howToRecognize":"Encuentra dos celdas con el mismo par {X, Y}. Luego busca una fila, columna o caja donde X solo aparezca en 2 celdas (S1 y S2) tales que S1 vea a la primera {X, Y} y S2 vea a la segunda {X, Y}.","whatAndWhyEliminate":"Se elimina el otro candidato Y de toda celda que vea simultáneamente a ambas celdas {X, Y}, porque en el enlace fuerte S1==S2 un extremo es X, lo que obliga a su {X, Y} vecina a ser Y.","whenNotToApply":"No aplica si el puente S1—S2 sobre X no es un enlace fuerte (es decir, si hay una tercera celda con X en esa unidad puente).","prereqConcepts":"Celdas bivaluadas, pares conjugados (enlaces fuertes) y XY-Wing."},"simple_coloring":{"id":"simple_coloring","order":12,"level":3,"name":"Simple Coloring (Single's Chains)","shortName":"Simple Coloring","category":"Cadenas de un Dígito","concept":"Construye una cadena de enlaces fuertes (pares conjugados donde un dígito D solo tiene 2 posiciones en una unidad) alternando dos colores (Color A y Color B). Toda la red cumple que o bien todas las celdas A son verdaderas, o bien todas las celdas B lo son. Si una celda externa ve a ambos colores (Color Trap), se elimina D de ella; si dos celdas del mismo color se ven (Color Wrap), ese color es falso.","whyItWorks":"En cada enlace fuerte exactamente uno de los dos extremos es verdadero, propagando paridad alternante (A ↔ B) a lo largo de toda la componente conexa.","patternTip":"Usa los botones de Color A y Color B sobre los pares conjugados de un mismo dígito y busca intersecciones entre celdas de distinto color.","problemSolved":"Rastrea cadenas largas de pares conjugados de un mismo dígito a través de todo el tablero cuando los patrones cortos (X-Wing) no bastan.","purpose":"Dividir una red conexa de enlaces fuertes de un dígito D en dos colores de paridad opuesta (Color A y Color B) donde uno de los dos colores es íntegramente verdadero.","whenToUse":"Cuando un mismo dígito D tiene múltiples pares conjugados (unidades con exactamente 2 apariciones de D) encadenados entre sí.","conditions":"Todos los enlaces de la cadena deben ser enlaces fuertes (exactamente 2 candidatos de D en la fila, columna o caja que los une), alternando Color A y Color B.","howToRecognize":"Elige un dígito D, marca una celda de un par conjugado con Color A y su pareja con Color B, y sigue propagando colores alternos por cada fila, columna o caja donde D solo tenga 2 opciones.","whatAndWhyEliminate":"1) Color Trap (Regla 2): cualquier celda externa que vea a la vez a una celda Color A y a una Color B pierde el candidato D. 2) Color Wrap (Regla 4): si dos celdas del MISMO color se ven entre sí, todo ese color es falso y se elimina D de él.","whenNotToApply":"Nunca extiendas el coloreo simple a través de un enlace débil (una unidad con 3 o más candidatos de D): en Simple Coloring cada salto entre A y B debe ser un par conjugado estricto.","prereqConcepts":"Pares conjugados (enlaces fuertes) y paridad booleana."},"multi_coloring":{"id":"multi_coloring","order":13,"level":3,"name":"Multi-Coloring","shortName":"Multi-Coloring","category":"Cadenas de un Dígito","concept":"Extiende el coloreo a dos componentes conexas independientes de pares conjugados sobre el mismo dígito: (A1, B1) y (A2, B2). Si una celda de color A1 comparte unidad (enlace débil) con una celda de color A2, ambos colores A1 y A2 no pueden ser simultáneamente verdaderos, lo que implica que al menos uno de los colores opuestos (B1 o B2) es verdadero. Toda celda que vea a B1 y a B2 pierde ese candidato.","whyItWorks":"En el grupo 1 se cumple (A1 ∨ B1) y en el grupo 2 se cumple (A2 ∨ B2). Como ¬(A1 ∧ A2) por verse mutuamente, se deduce (B1 ∨ B2).","patternTip":"Colorea dos cadenas separadas del mismo dígito y busca un enlace débil (misma fila, columna o caja) que conecte un color de la primera cadena con un color de la segunda.","problemSolved":"Resuelve tableros donde un dígito forma dos redes separadas de pares conjugados que no comparten celdas, pero se ven entre sí mediante un enlace débil.","purpose":"Conectar dos clústeres independientes de coloreo (A1/B1 y A2/B2) para deducir eliminaciones entre ambos grupos.","whenToUse":"Cuando al aplicar Simple Coloring sobre un dígito D obtienes dos cadenas separadas sin que ninguna por sí sola produzca eliminaciones.","conditions":"Deben existir dos componentes de enlaces fuertes (A1, B1) y (A2, B2) sobre el mismo dígito D conectadas por visibilidad entre celdas de distintos clústeres.","howToRecognize":"Colorea el primer grupo de pares conjugados con (A1, B1) y el segundo grupo independiente con (A2, B2). Observa qué colores de ambos grupos comparten fila, columna o región.","whatAndWhyEliminate":"Tipo 1 (Wrap): si un color A1 ve tanto a A2 como a B2, todas las celdas A1 son falsas. Tipo 2 (Trap): si A1 ve a A2 (enlace débil), no pueden ser ambos verdaderos, luego B1 o B2 es verdadero y toda celda que vea tanto a B1 como a B2 pierde D.","whenNotToApply":"No confundas los colores de dos clústeres independientes como si tuvieran la misma paridad antes de verificar qué puente débil los relaciona.","prereqConcepts":"Simple Coloring, enlaces fuertes y enlaces débiles."},"skyscraper":{"id":"skyscraper","order":14,"level":3,"name":"Skyscraper (Rascacielos)","shortName":"Skyscraper","category":"Turbot Fish / Cadenas Cortas","concept":"Dos filas (o dos columnas) tienen cada una un enlace fuerte (exactamente 2 candidatos) para el dígito D. Dos de esos extremos están alineados en la misma columna (la base del rascacielos), mientras que los otros dos extremos (las cimas o tejados) están en columnas distintas. Al menos una de las dos cimas debe contener D, eliminando D de cualquier celda que vea a ambas cimas.","whyItWorks":"Las dos bases comparten columna y no pueden ser ambas verdaderas; por tanto, al menos una de las dos filas debe colocar el dígito D en su cima.","patternTip":"Busca un 'X-Wing deformado' donde dos filas tienen solo 2 candidatos de un dígito: comparten una columna, pero la segunda columna está desplazada dentro de la misma franja.","problemSolved":"Actúa cuando dos líneas paralelas tienen enlaces fuertes para un dígito D pero están desalineadas en una de sus columnas (por lo que no forman un X-Wing).","purpose":"Aprovechar una columna (o fila) base compartida entre dos enlaces fuertes paralelos para eliminar el candidato en la intersección de sus dos cimas.","whenToUse":"Cuando buscas un X-Wing sobre un dígito D y encuentras dos filas (o columnas) con 2 candidatos que coinciden en un extremo pero no en el otro.","conditions":"1) Dos filas (o dos columnas) con exactamente 2 candidatos de D cada una. 2) Un extremo de la primera y un extremo de la segunda comparten la misma columna (base). 3) Los otros dos extremos (cimas) están en columnas distintas.","howToRecognize":"Visualiza dos torres (dos filas o dos columnas con 2 candidatos de D): sus bases descansan sobre la misma línea perpendicular, y sus dos tejados (cimas) quedan a distinta altura dentro de la misma franja.","whatAndWhyEliminate":"Se elimina D de cualquier celda externa que vea simultáneamente a AMBAS cimas del rascacielos, porque las dos bases no pueden ser ambas verdaderas, forzando a que al menos una cima contenga D.","whenNotToApply":"No elimines D a lo largo de toda la columna de las cimas como si fuera un X-Wing: solo pueden eliminarse las celdas que ven a las dos cimas a la vez.","prereqConcepts":"X-Wing, enlaces fuertes y enlaces débiles."},"two_string_kite":{"id":"two_string_kite","order":15,"level":3,"name":"Two-String Kite (Cometa de Dos Cuerdas)","shortName":"Two-String Kite","category":"Turbot Fish / Cadenas Cortas","concept":"Para un dígito D, existe un enlace fuerte en una fila y otro enlace fuerte en una columna tales que uno de los extremos de la fila y uno de los extremos de la columna caen dentro de la misma región 3×3 (sin ser la misma celda). Como los dos extremos dentro de la caja se ven entre sí, al menos uno de los dos extremos libres (las puntas de la cometa) debe contener D, eliminando D en la celda donde se cruzan.","whyItWorks":"El enlace débil dentro de la región 3×3 conecta el par conjugado de la fila con el par conjugado de la columna, garantizando que al menos uno de los extremos exteriores sea verdadero.","patternTip":"Busca una fila y una columna con exactamente 2 candidatos del mismo número que se enganchen dentro de una misma caja 3×3.","problemSolved":"Conecta un enlace fuerte horizontal (fila) con un enlace fuerte vertical (columna) a través de una región 3×3 compartida.","purpose":"Garantizar que al menos uno de los dos extremos exteriores (las puntas de la cometa) contenga el dígito D.","whenToUse":"Cuando para un dígito D existe una fila con 2 candidatos y una columna con 2 candidatos que pasan por la misma caja 3×3.","conditions":"1) Una fila con exactamente 2 apariciones de D (F1, F2). 2) Una columna con exactamente 2 apariciones de D (C1, C2). 3) F1 y C1 son celdas distintas pero pertenecen a la misma región 3×3.","howToRecognize":"Filtra un dígito D, busca una fila y una columna que tengan solo 2 candidatos y verifica que un extremo de la fila y un extremo de la columna caigan dentro de la misma caja 3×3 (sin ser la misma celda).","whatAndWhyEliminate":"Se elimina D de la celda situada en el cruce perpendicular de los dos extremos libres (F2 y C2), ya que como F1 y C1 comparten caja no pueden ser ambos verdaderos, obligando a F2 o C2 a ser D.","whenNotToApply":"No aplica si la fila y la columna comparten exactamente la misma celda en su intersección (eso serían solo 3 celdas, no 4).","prereqConcepts":"Skyscraper y cadenas de un solo dígito (Turbot Fish)."},"empty_rectangle":{"id":"empty_rectangle","order":16,"level":3,"name":"Empty Rectangle (Rectángulo Vacío)","shortName":"Empty Rectangle","category":"Patrones de Intersección y Enlace","concept":"Dentro de una región 3×3, todos los candidatos de un dígito D se ubican sobre una única fila y una única columna (formando una cruz o 'L' y dejando un rectángulo de 4 celdas vacío de D). Si fuera de la caja existe un par conjugado perpendicular alineado con uno de los brazos de esa cruz, el otro extremo del par conjugado y el otro brazo de la cruz eliminan D en su intersección.","whyItWorks":"Si el extremo del par conjugado fuera verdadero, bloquearía un brazo de la cruz en la región, obligando a que el dígito D en esa región ocupe el brazo perpendicular.","patternTip":"Localiza una caja donde los candidatos de un dígito formen una 'L' o '+' (no alineados en una sola línea) y busca un par conjugado exterior que apunte a uno de sus dos ejes.","problemSolved":"Permite usar una región 3×3 como eslabón fuerte de giro aunque el dígito D tenga 3, 4 o 5 candidatos dentro de esa caja.","purpose":"Combinar una distribución en cruz ('L' o '+') de un dígito D dentro de una caja con un par conjugado exterior perpendicular.","whenToUse":"Cuando en una región 3×3 los candidatos de D no están en una sola línea (no hay Pointing), pero dejan vacío un rectángulo de 4 celdas al alinearse sobre una fila y una columna de esa caja.","conditions":"1) En una caja B, todos los candidatos de D caen en la unión de una fila F_er y una columna C_er. 2) Fuera de la caja B existe un par conjugado perpendicular con un extremo en F_er (o en C_er).","howToRecognize":"Encuentra una caja donde los candidatos de D puedan tacharse por completo trazando una sola línea horizontal (F_er) y una sola línea vertical (C_er). Luego busca un par conjugado exterior alineado con una de esas dos líneas.","whatAndWhyEliminate":"Se elimina D en la celda donde se cruza la segunda línea del Empty Rectangle con el extremo libre del par conjugado exterior, pues si ese extremo fuera falso, el otro extremo vaciaría una rama de la caja y forzaría D en la rama perpendicular.","whenNotToApply":"No aplica si queda algún candidato de D en las 4 esquinas fuera de la cruz dentro de la caja B, o si el enlace exterior no es un par conjugado de 2 celdas.","prereqConcepts":"Locked Candidates y Two-String Kite."},"unique_rectangle":{"id":"unique_rectangle","order":17,"level":3,"name":"Unique Rectangle (Rectángulo Único)","shortName":"Unique Rectangle","category":"Patrones de Unicidad","concept":"Cuatro celdas que forman las esquinas de un rectángulo repartido en exactamente 2 filas, 2 columnas y 2 regiones 3×3. Si las cuatro esquinas contuvieran únicamente el par {X, Y}, el Sudoku tendría dos soluciones intercambiables (Patrón Mortal). Como todo Sudoku válido tiene solución única, al menos una esquina debe tomar un candidato adicional Z (Tipo 1) o forzar Z en las esquinas con candidatos extra (Tipo 2).","whyItWorks":"Evitar el bucle de permutación mortal {X,Y} ↔ {Y,X} en las cuatro esquinas obliga a que los candidatos adicionales rompan la simetría.","patternTip":"Busca cuatro celdas en rectángulo que ocupen dos cajas 3×3 y compartan la pareja base {X, Y}, observando qué esquinas tienen candidatos extra.","problemSolved":"Desbloquea posiciones cerradas explotando la propiedad fundamental de que todo Sudoku válido tiene una única solución.","purpose":"Impedir que cuatro celdas en rectángulo queden reducidas al patrón mortal intercambiable {X, Y} en dos filas, dos columnas y dos cajas.","whenToUse":"Cuando observas 4 celdas que forman las esquinas de un rectángulo en 2 cajas y todas contienen la misma pareja de candidatos base {X, Y}.","conditions":"1) Cuatro celdas sin pistas iniciales en 2 filas, 2 columnas y exactamente 2 regiones 3×3. 2) En Tipo 1: tres esquinas tienen solo {X, Y} y la cuarta tiene {X, Y, ...}. 3) En Tipo 2: dos esquinas en línea tienen {X, Y} y las otras dos esquinas (también alineadas en fila o columna) tienen {X, Y, Z}.","howToRecognize":"Busca dos celdas bivaluadas {X, Y} en una misma fila o columna y mira sus dos celdas espejo formando un rectángulo en dos cajas. Revisa qué candidatos adicionales tienen las otras esquinas.","whatAndWhyEliminate":"En Tipo 1 se eliminan X e Y de la cuarta esquina. En Tipo 2, como una de las dos esquinas {X, Y, Z} alineadas debe tomar Z para evitar el patrón mortal, se elimina Z de toda celda que vea a ambas esquinas {X, Y, Z}.","whenNotToApply":"JAMÁS se aplica si las 4 esquinas ocupan 4 cajas distintas (en lugar de 2 cajas), ni en Tipo 2 si las dos esquinas con Z están en diagonal en vez de compartir fila o columna.","prereqConcepts":"Solución única de un Sudoku y patrones mortales."},"als_xz":{"id":"als_xz","order":18,"level":4,"name":"ALS (Almost Locked Sets — Regla XZ)","shortName":"ALS-XZ","category":"Conjuntos Casi Bloqueados","concept":"Un Conjunto Casi Bloqueado (ALS) es un grupo de N celdas dentro de una misma unidad que contienen exactamente N+1 candidatos en total. Si dos ALS disjuntos (ALS A y ALS B) comparten un Candidato Común Restringido X (todas las celdas con X en A ven a todas las celdas con X en B) y además comparten otro candidato Z, entonces Z puede eliminarse de cualquier celda externa que vea a todas las instancias de Z en ambos ALS.","whyItWorks":"Como X no puede estar simultáneamente en ALS A y en ALS B, al menos uno de los dos ALS pierde el candidato X y se convierte en un Conjunto Bloqueado (N celdas con N dígitos), forzando a que Z sea verdadero en ese ALS.","patternTip":"Identifica pares de celdas en una fila/caja con 3 candidatos unidos (ALS de tamaño 2) y busca qué candidato común X tienen totalmente conectado entre sí.","problemSolved":"Generaliza los Naked Pairs/Triples y las alas (XY-Wing/XYZ-Wing) cuando los subconjuntos tienen un candidato extra (N celdas con N+1 candidatos).","purpose":"Conectar dos Conjuntos Casi Bloqueados (ALS A y ALS B) mediante un Candidato Común Restringido (RCC X) para eliminar otro candidato común Z.","whenToUse":"En el Nivel Maestro, cuando existen grupos compactos de 1 o 2 celdas en distintas unidades que tienen exactamente un candidato más que su número de celdas.","conditions":"1) Dos conjuntos ALS disjuntos A y B en distintas unidades. 2) Un candidato común restringido X tal que TODAS las celdas con X en A vean a TODAS las celdas con X en B. 3) Un segundo candidato común Z ≠ X presente en ambos ALS.","howToRecognize":"Localiza dos grupos ALS (por ejemplo, 2 celdas en una fila con 3 candidatos {1,4,7} y 2 celdas en otra fila con 3 candidatos {1,5,7}). Verifica que todas las apariciones del candidato compartido X (ej. 1) se vean entre sí.","whatAndWhyEliminate":"Se elimina el segundo candidato común Z (ej. 7) de cualquier celda externa que vea a TODAS las celdas que contienen Z tanto en ALS A como en ALS B, porque uno de los dos ALS perderá X y quedará bloqueado forzando Z.","whenNotToApply":"No aplica si alguna celda con X en ALS A NO ve a alguna celda con X en ALS B, o si la celda objetivo no alcanza a ver todas las apariciones de Z en ambos conjuntos.","prereqConcepts":"Subconjuntos desnudos, XY-Wing y concepto de Conjunto Casi Bloqueado (N celdas con N+1 candidatos en una unidad)."},"aic":{"id":"aic","order":19,"level":4,"name":"AIC (Alternating Inference Chains)","shortName":"AIC","category":"Cadenas de Inferencia","concept":"Una Cadena de Inferencia Alternante (AIC) alterna enlaces fuertes (si A es falso, B es verdadero: `A = B`, ya sea en una celda bivaluada o en un par conjugado de unidad) y enlaces débiles (si B es verdadero, C es falso: `B - C`), comenzando y terminando en enlace fuerte. Esto establece un enlace fuerte global entre los dos extremos de la cadena, permitiendo eliminaciones de Tipo 1 (mismo dígito en ambos extremos) o Tipo 2 (distinto dígito en extremos que se ven).","whyItWorks":"Por transitividad lógica: si el primer nodo es falso, cada enlace fuerte fuerza verdadero su par y cada enlace débil fuerza falso el siguiente, haciendo verdadero el último nodo. Por tanto, al menos uno de los dos extremos es verdadero.","patternTip":"Combina enlaces fuertes dentro de celdas bivaluadas con pares conjugados en filas/columnas para saltar de un dígito a otro manteniendo la alternancia Fuerte-Débil-Fuerte.","problemSolved":"Conecta candidatos de diferentes dígitos y unidades en una cadena lógica continua cuando ningún patrón geométrico fijo está disponible.","purpose":"Establecer una equivalencia lógica fuerte entre el primer candidato y el último candidato de una cadena que alterna enlaces fuertes (=) y débiles (-).","whenToUse":"Cuando existen pares conjugados en unidades y celdas bivaluadas que pueden enlazarse alternando inferencias fuertes y débiles.","conditions":"1) La cadena debe empezar y terminar con un enlace fuerte (`A = B - C = D ... = Z`). 2) Debe alternar estrictamente enlace fuerte (si uno es falso, el otro es verdadero) y enlace débil (si uno es verdadero, el otro es falso) a través de al menos dos dígitos distintos.","howToRecognize":"Sigue el grafo de candidatos: sal de un candidato por un enlace fuerte (par conjugado en unidad o celda bivaluada), pasa por un enlace débil (misma celda o par que se ve en el mismo dígito) y vuelve a tomar un enlace fuerte.","whatAndWhyEliminate":"Como al menos uno de los dos extremos de la cadena es verdadero: en Tipo 1 (mismo dígito D en ambos extremos) se elimina D de las celdas que ven a ambos extremos; en Tipo 2 (extremos (C1, d1) y (C2, d2) que se ven) se elimina d2 de C1 y d1 de C2.","whenNotToApply":"No es válida una cadena que concatene dos enlaces débiles seguidos (`-` seguido de `-`) o que no inicie y termine en enlace fuerte.","prereqConcepts":"Enlaces fuertes (bilocales y bivaluados), enlaces débiles, W-Wing y coloreo."},"forcing_chains":{"id":"forcing_chains","order":20,"level":4,"name":"Forcing Chains (Cadenas Forzadas)","shortName":"Forcing Chains","category":"Cadenas de Ramificación Múltiple","concept":"Parte de una celda origen con 2 o 3 candidatos posibles {d1, d2, d3} (o una unidad con 2-3 posiciones para un dígito) y propaga las implicaciones lógicas de cada opción por separado. Si absolutamente todas las ramas convergen en la misma conclusión (por ejemplo, que una celda objetivo T no puede contener el candidato Z en ninguna de las ramas), esa conclusión es lógicamente segura sin adivinar.","whyItWorks":"Como los candidatos de la celda origen son exhaustivos (uno de ellos es necesariamente verdadero en la solución única), cualquier consecuencia común a todas las ramas se cumple incondicionalmente.","patternTip":"Elige una celda trivaluada {d1, d2, d3} rodeada de celdas bivaluadas y comprueba qué ocurre con un candidato objetivo Z bajo cada una de las tres hipótesis.","problemSolved":"Resuelve bloqueos donde una celda tiene 3 candidatos posibles {d1, d2, d3} y cada uno de los tres caminos posibles conduce inevitablemente a la misma eliminación.","purpose":"Demostrar por casos exhaustivos (sin adivinar) que un candidato objetivo Z en una celda T es imposible bajo cualquiera de las 3 opciones de la celda origen.","whenToUse":"Cuando una celda trivaluada {d1, d2, d3} está rodeada de celdas bivaluadas que convergen sobre un mismo candidato objetivo.","conditions":"Para una celda origen S con candidatos {d1, d2, d3}, al propagar por separado las implicaciones directas de S=d1, S=d2 y S=d3, las TRES ramas deben eliminar el mismo candidato Z en la misma celda objetivo T.","howToRecognize":"Ubica una celda con 3 candidatos {d1, d2, d3}. Sigue qué ocurre en sus celdas bivaluadas vecinas si eliges d1, si eliges d2 y si eliges d3. Si en las tres ramas una celda común resulta ser Z, cualquier celda T que vea a los tres finales pierde Z.","whatAndWhyEliminate":"Se elimina el candidato Z de la celda objetivo T donde convergen las tres ramas, porque uno de los tres candidatos de S tiene que ser verdadero en la solución y en los tres casos T no puede ser Z.","whenNotToApply":"No se puede eliminar nada si solo 2 de las 3 ramas coinciden pero la tercera rama no fuerza la misma conclusión.","prereqConcepts":"XYZ-Wing, propagación de implicaciones y cadenas de inferencia."},"sue_de_coq":{"id":"sue_de_coq","order":21,"level":4,"name":"Sue de Coq (Subconjuntos Disjuntos de Dos Sectores)","shortName":"Sue de Coq","category":"Intersecciones Complejas / ALS","concept":"En la intersección I de una Región B y una Línea L (por ejemplo, 2 celdas vacías con 4 candidatos {d1, d2, d3, d4}), encontramos una celda (o subconjunto) AL en el resto de la Línea L con candidatos {d1, d3} y otra celda AB en el resto de la Región B con candidatos disjuntos {d2, d4}. En conjunto, las 4 celdas alojan exactamente los 4 candidatos, bloqueando {d1, d3} en la línea L y {d2, d4} en la región B.","whyItWorks":"La unión de I, AL y AB contiene N celdas y exactamente N candidatos posibles sin solapamiento entre AL y AB, saturando un candidato por celda en ambas unidades.","patternTip":"Busca 2 celdas en el cruce de una fila y una caja que tengan 4 candidatos, y comprueba siesos 4 candidatos se dividen en un par en la fila y el par complementario en la caja.","problemSolved":"Desbloquea intersecciones complejas entre una región 3×3 y una fila/columna cuando la intersección tiene demasiados candidatos para un Locked Candidate.","purpose":"Descomponer los candidatos de una intersección línea-caja en dos subconjuntos disjuntos: uno en el resto de la línea y otro en el resto de la caja.","whenToUse":"Cuando 2 celdas vacías en la intersección de una fila y una caja contienen 4 candidatos {d1, d2, d3, d4}.","conditions":"1) Intersección I de 2 celdas (en Caja B ∩ Línea L) con 4 candidatos. 2) Una celda AL en el resto de L con 2 de esos candidatos {d1, d3}. 3) Una celda AB en el resto de B con los otros 2 candidatos disjuntos {d2, d4}.","howToRecognize":"Busca 2 celdas en el cruce de una fila y una caja que sumen 4 candidatos. Luego busca en el resto de esa fila una celda bivaluada con un par de esos 4, y en el resto de la caja otra celda bivaluada con el par complementario.","whatAndWhyEliminate":"En total hay 4 celdas para 4 dígitos {d1, d2, d3, d4}: se eliminan los candidatos del subconjunto de línea {d1, d3} del resto de la línea L, y los candidatos del subconjunto de caja {d2, d4} del resto de la caja B.","whenNotToApply":"No aplica si los candidatos de la celda de línea AL y la celda de caja AB se solapan (comparten algún dígito) o si el total de dígitos supera al número total de celdas.","prereqConcepts":"Locked Candidates, Naked Quads y Conjuntos Casi Bloqueados (ALS)."},"death_blossom":{"id":"death_blossom","order":22,"level":4,"name":"Death Blossom","shortName":"Death Blossom","category":"Redes de Conjuntos Casi Bloqueados","concept":"Una celda tallo (Stem) con candidatos {d1, d2} se conecta simultáneamente a dos Conjuntos Casi Bloqueados (Pétalo ALS 1 y Pétalo ALS 2): el Pétalo 1 comparte el candidato común restringido d1 con el tallo, y el Pétalo 2 comparte el candidato común restringido d2 con el tallo. Si ambos pétalos contienen un candidato común Z, cualquier celda externa que vea a todos los Z de ambos pétalos no puede contener Z.","whyItWorks":"Como el tallo debe tomar d1 o d2, el pétalo correspondiente pierde ese candidato y se bloquea, forzando que Z sea verdadero en al menos uno de los dos pétalos ALS.","patternTip":"Localiza una celda tallo bivaluada {d1, d2} y sigue cada uno de sus dos dígitos hacia un ALS de 2 celdas cercano que comparta un mismo dígito final Z.","problemSolved":"Resuelve redes donde una celda tallo (Stem) no se conecta a simples celdas bivaluadas, sino a múltiples Conjuntos Casi Bloqueados (pétalos ALS).","purpose":"Vincular cada candidato de una celda tallo S a un pétalo ALS distinto de modo que todos los pétalos compartan un candidato común de eliminación Z.","whenToUse":"Cuando una celda tallo bivaluada {d1, d2} (o trivaluada) ve los candidatos d1 y d2 de dos conjuntos ALS cercanos que comparten otro dígito Z.","conditions":"1) Una celda tallo S con candidatos {d1, d2}. 2) Un Pétalo ALS 1 donde todas sus celdas con d1 ven a S. 3) Un Pétalo ALS 2 disjunto donde todas sus celdas con d2 ven a S. 4) Ambos pétalos contienen un candidato común Z.","howToRecognize":"Toma una celda bivaluada {d1, d2} como tallo. Busca un ALS de 2 celdas que se conecte con d1 y otro ALS que se conecte con d2, comprobando que ambos pétalos tengan en común un candidato final Z.","whatAndWhyEliminate":"Se elimina Z de cualquier celda externa que vea simultáneamente a todas las apariciones de Z en todos los pétalos ALS, ya que sea cual sea el valor del tallo (d1 o d2), uno de los pétalos se bloqueará y contendrá Z.","whenNotToApply":"No confundas un XY-Wing simple (dos pétalos de 1 sola celda) con un Death Blossom, ni apliques la regla si los dos pétalos ALS comparten celdas entre sí.","prereqConcepts":"ALS-XZ, XY-Wing y Forcing Chains."},"advanced_chains":{"id":"advanced_chains","order":23,"level":4,"name":"Técnicas Avanzadas de Cadenas y Patrones Complejos","shortName":"Patrones Complejos / Finned","category":"Peces con Aleta y Cadenas Agrupadas","concept":"Integra enlaces fuertes agrupados y patrones de peces con aleta (Finned X-Wing / Finned Swordfish / Grouped AIC): cuando una de las líneas base de un X-Wing tiene un candidato adicional (la Aleta o Fin) dentro de una misma región 3×3, las eliminaciones siguen siendo válidas en la intersección entre la columna de cobertura y la región que contiene la aleta.","whyItWorks":"O bien la aleta es verdadera (eliminando el candidato en su propia región 3×3), o bien la aleta es falsa y el X-Wing clásico es verdadero (eliminando el candidato en toda la columna de cobertura). En ambos casos, las celdas que ven tanto a la columna como a la aleta pierden el candidato.","patternTip":"Busca un X-Wing casi perfecto donde una de las dos filas tiene una tercera aparición extra (la aleta) pegada a una de las esquinas dentro de la misma caja 3×3.","problemSolved":"Permite eliminar candidatos en patrones de peces (X-Wing / Swordfish) que tienen un candidato extra ('aleta' o Fin) que impide aplicar el X-Wing clásico.","purpose":"Combinar la lógica de un X-Wing con la restricción de la región 3×3 donde se aloja la aleta (Finned X-Wing / Cadena Agrupada).","whenToUse":"Cuando encuentras un X-Wing donde una de las dos filas base tiene 2 candidatos perfectos, pero la segunda fila base tiene un 3er candidato adicional (la aleta) en la misma caja que una de las esquinas.","conditions":"1) Una fila base F1 con exactamente 2 apariciones de D en las columnas C1 y C2. 2) Una segunda fila base F2 con apariciones de D en C1, C2 y una celda adicional (Fin) situada en la misma caja 3×3 que la esquina (F2, C2).","howToRecognize":"Busca un X-Wing casi completo donde una esquina tiene un candidato extra de D justo al lado, dentro de su misma región 3×3.","whatAndWhyEliminate":"Se elimina D de las celdas que pertenecen simultáneamente a la columna de cobertura C2 y a la región 3×3 de la aleta (fuera de las filas base), porque tanto si la aleta es verdadera como si es falsa (activando el X-Wing), esas celdas no pueden contener D.","whenNotToApply":"No puedes eliminar D en toda la columna C2 fuera de la caja de la aleta, porque si la aleta fuera verdadera el X-Wing no cubriría el resto de la columna.","prereqConcepts":"X-Wing, Locked Candidates y enlaces fuertes agrupados."}};

// ===== Sudoku solver & 23-technique detection engine =====
    // =========================================================================
    // 2. REAL SUDOKU SOLVER & 23-TECHNIQUE ENGINE
    // =========================================================================
    

// Load core helpers
const ROWS = Array.from({length: 9}, (_, r) => Array.from({length: 9}, (_, c) => r * 9 + c));
const COLS = Array.from({length: 9}, (_, c) => Array.from({length: 9}, (_, r) => r * 9 + c));
const BOXES = Array.from({length: 9}, (_, b) => {
  const br = Math.floor(b / 3) * 3, bc = (b % 3) * 3;
  const cells = [];
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) cells.push((br + r) * 9 + (bc + c));
  return cells;
});
const UNITS = [
  ...ROWS.map((cells, i) => ({ type: 'row', index: i, name: `Fila ${i+1}`, cells })),
  ...COLS.map((cells, i) => ({ type: 'col', index: i, name: `Columna ${i+1}`, cells })),
  ...BOXES.map((cells, i) => ({ type: 'box', index: i, name: `Región ${i+1}`, cells }))
];

const CELL_ROW = Array.from({length: 81}, (_, i) => Math.floor(i / 9));
const CELL_COL = Array.from({length: 81}, (_, i) => i % 9);
const CELL_BOX = Array.from({length: 81}, (_, i) => Math.floor(Math.floor(i / 9) / 3) * 3 + Math.floor((i % 9) / 3));

const PEERS = Array.from({length: 81}, (_, i) => {
  const set = new Set([...ROWS[CELL_ROW[i]], ...COLS[CELL_COL[i]], ...BOXES[CELL_BOX[i]]]);
  set.delete(i);
  return Array.from(set);
});
const PEER_SET = PEERS.map(p => new Set(p));

function sees(a, b) { return a !== b && PEER_SET[a].has(b); }
function cellName(idx) { return `F${CELL_ROW[idx] + 1}C${CELL_COL[idx] + 1}`; }
function countBits(mask) { let c = 0; while (mask) { mask &= (mask - 1); c++; } return c; }
function bitsToDigits(mask) { const res = []; for (let d = 1; d <= 9; d++) if (mask & (1 << d)) res.push(d); return res; }
function digitsToMask(digits) { let m = 0; for (const d of digits) m |= (1 << d); return m; }

function solveAndCount(gridInput, limit = 2) {
  const grid = gridInput.slice();
  const cands = new Int32Array(81);
  for (let i = 0; i < 81; i++) if (grid[i] === 0) cands[i] = 0x3FE;
  for (let i = 0; i < 81; i++) {
    if (grid[i] !== 0) {
      const bit = 1 << grid[i];
      for (const p of PEERS[i]) {
        if (grid[p] === grid[i]) return { count: 0, solution: null };
        cands[p] &= ~bit;
      }
    }
  }
  let solutions = 0, firstSol = null;
  function backtrack(g, c) {
    if (solutions >= limit) return;
    let bestCell = -1, bestCount = 10;
    for (let i = 0; i < 81; i++) {
      if (g[i] === 0) {
        const cnt = countBits(c[i]);
        if (cnt === 0) return;
        if (cnt < bestCount) { bestCount = cnt; bestCell = i; if (cnt === 1) break; }
      }
    }
    if (bestCell === -1) {
      solutions++;
      if (!firstSol) firstSol = g.slice();
      return;
    }
    const mask = c[bestCell];
    for (let d = 1; d <= 9; d++) {
      const bit = 1 << d;
      if (mask & bit) {
        const ng = g.slice(), nc = new Int32Array(c);
        ng[bestCell] = d; nc[bestCell] = 0;
        let ok = true;
        for (const p of PEERS[bestCell]) {
          if (ng[p] === 0) {
            nc[p] &= ~bit;
            if (nc[p] === 0) { ok = false; break; }
          }
        }
        if (ok) backtrack(ng, nc);
        if (solutions >= limit) return;
      }
    }
  }
  backtrack(grid, cands);
  return { count: solutions, solution: firstSol };
}

// Compute standard peer-eliminated candidates from grid
function initCandidates(grid) {
  const cands = new Int32Array(81);
  for (let i = 0; i < 81; i++) {
    if (grid[i] !== 0) { cands[i] = 0; continue; }
    let mask = 0x3FE;
    for (const p of PEERS[i]) if (grid[p] !== 0) mask &= ~(1 << grid[p]);
    cands[i] = mask;
  }
  return cands;
}

// Check if any Naked or Hidden Single exists
function hasBasicSingles(grid, cands) {
  for (let i = 0; i < 81; i++) {
    if (grid[i] === 0 && countBits(cands[i]) === 1) return true;
  }
  for (const unit of UNITS) {
    for (let d = 1; d <= 9; d++) {
      const bit = 1 << d;
      let count = 0;
      for (const c of unit.cells) {
        if (grid[c] === d) { count = -1; break; }
        if (grid[c] === 0 && (cands[c] & bit)) count++;
      }
      if (count === 1) return true;
    }
  }
  return false;
}

// Combinations helper
function combinations(arr, k) {
  const res = [];
  function helper(start, combo) {
    if (combo.length === k) { res.push(combo.slice()); return; }
    for (let i = start; i < arr.length; i++) {
      combo.push(arr[i]);
      helper(i + 1, combo);
      combo.pop();
    }
  }
  helper(0, []);
  return res;
}

// 1. Locked Candidates (Pointing & Claiming)
function detectLockedCandidates(grid, cands) {
  // Pointing: Box -> Row/Col
  for (let b = 0; b < 9; b++) {
    const boxCells = BOXES[b];
    for (let d = 1; d <= 9; d++) {
      const bit = 1 << d;
      const cells = boxCells.filter(c => grid[c] === 0 && (cands[c] & bit));
      if (cells.length < 2 || cells.length > 3) continue;
      const rows = new Set(cells.map(c => CELL_ROW[c]));
      if (rows.size === 1) {
        const r = [...rows][0];
        const elims = ROWS[r].filter(c => CELL_BOX[c] !== b && grid[c] === 0 && (cands[c] & bit)).map(cell => ({ cell, digit: d }));
        if (elims.length > 0) {
          return {
            techniqueId: 'locked_candidates',
            subType: 'Pointing',
            digit: d,
            patternCells: cells,
            eliminations: elims,
            regions: [{ type: 'box', index: b }, { type: 'row', index: r }],
            links: [],
            summary: `En la Región ${b+1}, el candidato ${d} está restringido únicamente a la Fila ${r+1} (${cells.map(cellName).join(', ')}). Por tanto, ${d} puede eliminarse del resto de la Fila ${r+1}.`
          };
        }
      }
      const cols = new Set(cells.map(c => CELL_COL[c]));
      if (cols.size === 1) {
        const col = [...cols][0];
        const elims = COLS[col].filter(c => CELL_BOX[c] !== b && grid[c] === 0 && (cands[c] & bit)).map(cell => ({ cell, digit: d }));
        if (elims.length > 0) {
          return {
            techniqueId: 'locked_candidates',
            subType: 'Pointing',
            digit: d,
            patternCells: cells,
            eliminations: elims,
            regions: [{ type: 'box', index: b }, { type: 'col', index: col }],
            links: [],
            summary: `En la Región ${b+1}, el candidato ${d} está restringido únicamente a la Columna ${col+1} (${cells.map(cellName).join(', ')}). Por tanto, ${d} puede eliminarse del resto de la Columna ${col+1}.`
          };
        }
      }
    }
  }
  // Claiming: Row/Col -> Box
  for (let r = 0; r < 9; r++) {
    for (let d = 1; d <= 9; d++) {
      const bit = 1 << d;
      const cells = ROWS[r].filter(c => grid[c] === 0 && (cands[c] & bit));
      if (cells.length < 2 || cells.length > 3) continue;
      const boxes = new Set(cells.map(c => CELL_BOX[c]));
      if (boxes.size === 1) {
        const b = [...boxes][0];
        const elims = BOXES[b].filter(c => CELL_ROW[c] !== r && grid[c] === 0 && (cands[c] & bit)).map(cell => ({ cell, digit: d }));
        if (elims.length > 0) {
          return {
            techniqueId: 'locked_candidates',
            subType: 'Claiming',
            digit: d,
            patternCells: cells,
            eliminations: elims,
            regions: [{ type: 'row', index: r }, { type: 'box', index: b }],
            links: [],
            summary: `En la Fila ${r+1}, el candidato ${d} solo aparece dentro de la Región ${b+1} (${cells.map(cellName).join(', ')}). Por tanto, ${d} puede eliminarse del resto de la Región ${b+1}.`
          };
        }
      }
    }
  }
  for (let col = 0; col < 9; col++) {
    for (let d = 1; d <= 9; d++) {
      const bit = 1 << d;
      const cells = COLS[col].filter(c => grid[c] === 0 && (cands[c] & bit));
      if (cells.length < 2 || cells.length > 3) continue;
      const boxes = new Set(cells.map(c => CELL_BOX[c]));
      if (boxes.size === 1) {
        const b = [...boxes][0];
        const elims = BOXES[b].filter(c => CELL_COL[c] !== col && grid[c] === 0 && (cands[c] & bit)).map(cell => ({ cell, digit: d }));
        if (elims.length > 0) {
          return {
            techniqueId: 'locked_candidates',
            subType: 'Claiming',
            digit: d,
            patternCells: cells,
            eliminations: elims,
            regions: [{ type: 'col', index: col }, { type: 'box', index: b }],
            links: [],
            summary: `En la Columna ${col+1}, el candidato ${d} solo aparece dentro de la Región ${b+1} (${cells.map(cellName).join(', ')}). Por tanto, ${d} puede eliminarse del resto de la Región ${b+1}.`
          };
        }
      }
    }
  }
  return null;
}

// 2. Naked Pairs
function detectNakedPairs(grid, cands) {
  for (const unit of UNITS) {
    const biCells = unit.cells.filter(c => grid[c] === 0 && countBits(cands[c]) === 2);
    for (let i = 0; i < biCells.length; i++) {
      for (let j = i + 1; j < biCells.length; j++) {
        const c1 = biCells[i], c2 = biCells[j];
        if (cands[c1] === cands[c2]) {
          const mask = cands[c1];
          const digits = bitsToDigits(mask);
          const elims = [];
          for (const c of unit.cells) {
            if (c !== c1 && c !== c2 && grid[c] === 0 && (cands[c] & mask)) {
              for (const d of digits) if (cands[c] & (1 << d)) elims.push({ cell: c, digit: d });
            }
          }
          if (elims.length > 0) {
            return {
              techniqueId: 'naked_pairs',
              digits,
              patternCells: [c1, c2],
              eliminations: elims,
              regions: [{ type: unit.type, index: unit.index }],
              links: [{ fromCell: c1, fromDigit: digits[0], toCell: c2, toDigit: digits[1], type: 'strong' }],
              summary: `En ${unit.name}, las celdas ${cellName(c1)} y ${cellName(c2)} contienen exclusivamente el par desnudo {${digits.join(', ')}}. Esos dos candidatos se eliminan del resto de ${unit.name}.`
            };
          }
        }
      }
    }
  }
  return null;
}

// 3. Hidden Pairs
function detectHiddenPairs(grid, cands) {
  for (const unit of UNITS) {
    const digitCells = {};
    for (let d = 1; d <= 9; d++) {
      const bit = 1 << d;
      const cells = unit.cells.filter(c => grid[c] === 0 && (cands[c] & bit));
      if (cells.length === 2) digitCells[d] = cells;
    }
    const availDigits = Object.keys(digitCells).map(Number);
    for (let i = 0; i < availDigits.length; i++) {
      for (let j = i + 1; j < availDigits.length; j++) {
        const d1 = availDigits[i], d2 = availDigits[j];
        const cells1 = digitCells[d1], cells2 = digitCells[d2];
        if (cells1[0] === cells2[0] && cells1[1] === cells2[1]) {
          const [c1, c2] = cells1;
          const pairMask = (1 << d1) | (1 << d2);
          const elims = [];
          for (const c of [c1, c2]) {
            const extra = cands[c] & ~pairMask;
            for (const ed of bitsToDigits(extra)) elims.push({ cell: c, digit: ed });
          }
          if (elims.length > 0) {
            return {
              techniqueId: 'hidden_pairs',
              digits: [d1, d2],
              patternCells: [c1, c2],
              eliminations: elims,
              regions: [{ type: unit.type, index: unit.index }],
              links: [],
              summary: `En ${unit.name}, los dígitos ${d1} y ${d2} solo pueden ubicarse en ${cellName(c1)} y ${cellName(c2)}. Por tanto, cualquier otro candidato en esas dos celdas queda eliminado.`
