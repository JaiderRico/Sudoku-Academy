  const key = techId + '_' + ref;
  if (!S.dynamic[key]) {
    for (let attempt = 0; attempt < 40; attempt++) {
      const cand = createRandomPracticeExercise(boards[Number(m[1])], rank, 100 + Number(m[2]));
      const used = boards.some(b => b.grid === cand.grid) || Object.values(S.dynamic).some(b => b && b.grid === cand.grid);
      if (!used && validateExerciseRecord(cand, rank).valid) { S.dynamic[key] = cand; break; }
    }
  }
  return S.dynamic[key] || null;
}
function nextVariantRef(base) {
  const k = S.techId + '_' + base;
  S.variantSerial[k] = (S.variantSerial[k] || 0) + 1;
  return `v${base}_${S.variantSerial[k]}`;
}

function loadExercise(techId, ref, stage, free = false) {
  stopPlay();
  const ex = getExercise(techId, ref);
  if (!ex) { setMsg('No se pudo preparar un tablero nuevo verificado en este intento. Toca otra vez.', 'warn'); render(); return; }
  const rank = rankOf(techId);
  const val = validateExerciseRecord(ex, rank);
  if (!val.valid) { setMsg(`Este tablero no pasó la verificación automática (${val.reason}).`, 'error'); render(); return; }

  Object.assign(S, {
    techId, ref, stage, free, ex, step: val.liveStep,
    givens: ex.grid.split('').map(Number), grid: ex.grid.split('').map(Number),
    solution: ex.solution.split('').map(Number), cands: Array.from(ex.cands),
    eliminated: [], picked: [], selected: -1, obsIdx: 0,
    hint: 0, showTargets: false, usedAuto: false, undo: [], msg: null,
    singles: [], singleShown: null, exSec: 0
  });
  S.ped = buildPedagogyForStep(S.step, TECHNIQUE_META[techId]);
  S.flow = stage === 'C' ? buildPractice() : (stage === 'D' || stage === 'E') ? buildEval() : null;

  const p = prog(techId);
  if (p && !free) {
    if (!p.examplesViewed.includes(ex.id)) p.examplesViewed.push(ex.id);
    if (stage === 'B') p.learnedTheory = true;
    if (p.status === 'not_started') p.status = 'learning';
    recompute(techId);
  }
  saveProgress();
  render();
  $('panelCol').scrollTop = 0;
}

// ------------------------------------------------------------------ flows
function buildPractice() {
  const st = S.step;
  const keyDigits = st.digit ? [st.digit] : (st.digits || []);
  const steps = [];
  if (keyDigits.length >= 1 && keyDigits.length <= 3) steps.push('digit');
  if (st.regions && st.regions.length) steps.push('zone');
  steps.push('cells', 'elim', 'single', 'done');
  return { kind: 'practice', steps, i: 0, keyDigits, zoneOptions: makeZoneOptions(st.regions || []), log: [], wrong: {} };
}
function buildEval() {
  return { kind: 'eval', steps: ['tech', 'cells', 'why', 'elim', 'done'], i: 0, techOptions: makeTechOptions(), whyOptions: makeWhyOptions(), techFirstTry: true, mistakes: 0, log: [], wrong: {}, result: null };
}
function curStep() { return S.flow ? S.flow.steps[S.flow.i] : null; }
function passed(name) { if (!S.flow) return false; const k = S.flow.steps.indexOf(name); return k >= 0 && k < S.flow.i; }
function advance() { S.flow.i = Math.min(S.flow.i + 1, S.flow.steps.length - 1); S.selected = -1; }

function zoneLabel(regs) {
  const by = { row: [], col: [], box: [] };
  for (const r of regs) by[r.type].push(r.index + 1);
  const parts = [];
  const fmt = (one, many, arr) => arr.length === 1 ? `${one} ${arr[0]}` : `${many} ${arr.slice(0, -1).join(', ')} y ${arr[arr.length - 1]}`;
  if (by.row.length) parts.push(fmt('Fila', 'Filas', by.row));
  if (by.col.length) parts.push(fmt('Columna', 'Columnas', by.col));
  if (by.box.length) parts.push(fmt('Región', 'Regiones', by.box));
  return parts.join(' + ');
}
function makeZoneOptions(regs) {
  if (!regs.length) return [];
  const right = zoneLabel(regs);
  const opts = [{ id: 'ok', text: right }];
  let guard = 0;
  while (opts.length < 3 && guard++ < 60) {
    const fake = regs.map(r => ({ type: r.type, index: Math.floor(Math.random() * 9) }));
    const keyset = new Set(fake.map(f => f.type + f.index));
    if (keyset.size !== fake.length) continue;
    const t = zoneLabel(fake);
    if (!opts.some(o => o.text === t)) opts.push({ id: 'w' + opts.length, text: t });
  }
  return shuffle(opts);
}
function makeTechOptions() {
  const me = TECHNIQUE_META[S.techId];
  const pool = TECHNIQUE_ORDER.map(t => t.id).filter(id => id !== S.techId);
  const near = shuffle(pool.filter(id => Math.abs(TECHNIQUE_META[id].level - me.level) <= (S.free ? 3 : 0)));
  const rest = shuffle(pool.filter(id => !near.includes(id)));
  const picks = [...near, ...rest].slice(0, 3);
  return shuffle([S.techId, ...picks]);
}
function makeWhyOptions() {
  const me = TECHNIQUE_META[S.techId];
  return shuffle([
    { id: 'ok', text: me.whatAndWhyEliminate || 'Porque el patrón obliga a que el número ocupe una posición que ve a la casilla afectada.' },
    { id: 'w1', text: 'Porque ese número aparece muchas veces en el tablero y conviene reducirlo probando.' },
    { id: 'w2', text: 'Porque la casilla afectada ya tenía un único candidato posible.' }
  ]);
}

// ------------------------------------------------------------------ singles
function findSingles(grid, cands) {
  const out = [], seen = new Set();
  for (let i = 0; i < 81; i++) if (grid[i] === 0 && countBits(cands[i]) === 1) {
    const d = bitsToDigits(cands[i])[0]; seen.add(i + ':' + d); out.push({ cell: i, digit: d, kind: 'naked' });
  }
  for (const u of UNITS) for (let d = 1; d <= 9; d++) {
    if (u.cells.some(c => grid[c] === d)) continue;
    const cs = u.cells.filter(c => grid[c] === 0 && (cands[c] & (1 << d)));
    if (cs.length === 1 && !seen.has(cs[0] + ':' + d)) { seen.add(cs[0] + ':' + d); out.push({ cell: cs[0], digit: d, kind: 'hidden', unit: u.name }); }
  }
  // Prefer singles created near the eliminations.
  const elimCells = new Set((S.step && S.step.eliminations || []).map(e => e.cell));
  out.sort((a, b) => (elimCells.has(b.cell) ? 1 : 0) - (elimCells.has(a.cell) ? 1 : 0));
  return out.filter(s => S.solution[s.cell] === s.digit);
}
function singleText(s) {
  return s.kind === 'naked'
    ? `En ${cellName(s.cell)} solo queda un candidato: el ${s.digit}.`
    : `En la ${s.unit}, el ${s.digit} solo cabe en ${cellName(s.cell)}.`;
}

// ------------------------------------------------------------------ actions
function setMsg(text, type = 'info') {
  const m = { text, type }; S.msg = m;
  clearTimeout(S.msgTimer);
  if (type === 'success') S.msgTimer = setTimeout(() => { if (S.msg === m) { S.msg = null; renderPanel(); } }, 5000);
}
function snapshot() {
  S.undo.push({ grid: S.grid.slice(), cands: S.cands.slice(), eliminated: S.eliminated.map(e => ({ ...e })) });
  if (S.undo.length > 40) S.undo.shift();
}
function undo() {
  const s = S.undo.pop(); if (!s) return;
  S.grid = s.grid; S.cands = s.cands; S.eliminated = s.eliminated;
  setMsg('Acción deshecha.', 'info'); render();
}

function onCell(idx) {
  const st = curStep();
  if (st === 'cells') {
    const k = S.picked.indexOf(idx);
    if (k >= 0) S.picked.splice(k, 1); else S.picked.push(idx);
    S.selected = idx;
  } else {
    S.selected = S.selected === idx && (S.stage === 'A' || S.stage === 'B') ? -1 : idx;
  }
  render();
}
function onDigit(d) {
  const st = curStep();
  if (st === 'elim') eliminate(S.selected, d);
  else if (st === 'single') placeSingle(S.selected, d);
}

function eliminate(cell, digit) {
  if (cell < 0) { setMsg('Primero toca una casilla del tablero; después el número que quieres tachar.', 'info'); return render(); }
  if (S.grid[cell] !== 0) { setMsg(`${cellName(cell)} ya tiene un número, no tiene candidatos.`, 'warn'); return render(); }
  const bit = 1 << digit;
  if (!(S.cands[cell] & bit)) { setMsg(`El ${digit} no es candidato en ${cellName(cell)}.`, 'warn'); return render(); }
  const meta = TECHNIQUE_META[S.techId];
  const targets = S.step.eliminations || [];
  if (!targets.some(e => e.cell === cell && e.digit === digit)) {
    S.progress.stats.errorsCount++;
    if (S.flow.kind === 'eval') S.flow.mistakes++;
    const inPattern = S.step.patternCells.includes(cell);
    setMsg(inPattern
      ? `${cellName(cell)} es parte del patrón: ahí el ${digit} está protegido. Lo que se elimina está en casillas que VEN al patrón, no dentro de él.`
      : `El ${digit} de ${cellName(cell)} no queda bloqueado por este patrón. Busca casillas que vean a la vez a las partes clave del patrón (${S.step.patternCells.slice(0, 2).map(cellName).join(', ')}…).`, 'error');
    saveProgress(); return render();
  }
  snapshot();
  S.cands[cell] &= ~bit;
  S.eliminated.push({ cell, digit });
  S.progress.stats.correctEliminations++;
  S.progress.stats.score += S.hint === 0 ? 50 : 25;
  const done = targets.filter(e => !(S.cands[e.cell] & (1 << e.digit))).length;
  if (done < targets.length) {
    setMsg(`✓ Bien: ${cellName(cell)} ya no puede ser ${digit}. Llevas ${done} de ${targets.length}.`, 'success');
    saveProgress(); return render();
  }
  finishEliminations();
}

function applyForMe() {
  snapshot();
  S.usedAuto = true;
  for (const e of S.step.eliminations) {
    if (S.cands[e.cell] & (1 << e.digit)) { S.cands[e.cell] &= ~(1 << e.digit); S.eliminated.push({ ...e }); }
  }
  finishEliminations(true);
}

function finishEliminations(auto = false) {
  const st = S.progress.stats, p = prog();
  st.completedExercises++;
  st.totalTimeSeconds += S.exSec;
  const autonomy = S.usedAuto ? 0 : Math.max(20, 100 - S.hint * 20);
  if (!S.usedAuto) { st.autonomySum += autonomy; st.autonomySamples++; st.score += S.hint === 0 ? 150 : 40; }
  S.flow.log.push(`Eliminaste: ${S.ped.elimNames.join(', ')}`);

  if (S.flow.kind === 'practice') {
    if (p && !S.free) { p.attempts++; if (!S.usedAuto) { p.guidedPracticeDone = true; p.bestAutonomy = Math.max(p.bestAutonomy, autonomy); } recompute(); }
    S.singles = findSingles(S.grid, S.cands);
    advance();
    if (!S.singles.length) advance();
    setMsg(auto ? 'Hecho. Mira en verde tachado lo que se eliminó.' : '¡Todas las eliminaciones correctas!', 'success');
  } else {
    const pass = !S.usedAuto && S.hint <= 1 && S.flow.techFirstTry;
    const reasons = [];
    if (S.usedAuto) reasons.push('usaste “Ver solución”');
    if (S.hint > 1) reasons.push(`usaste ${S.hint} pistas (máximo 1)`);
    if (!S.flow.techFirstTry) reasons.push('no reconociste la técnica al primer intento');
    S.flow.result = { pass, reasons };
    if (pass && !S.free && p) {
      const key = `${S.techId}_b${S.stage === 'E' ? 3 : 2}`;
      if (!p.evalBoardsSolved.includes(key)) p.evalBoardsSolved.push(key);
      p.practiceDone = true; p.attempts++; p.bestAutonomy = Math.max(p.bestAutonomy, autonomy);
      recompute();
    }
    advance();
    S.msg = null;
  }
  saveProgress();
  render();
  $('panelCol').scrollTop = 0;
}

function placeSingle(cell, d) {
  if (cell < 0) { setMsg('Toca primero la casilla donde crees que ya se puede colocar un número.', 'info'); return render(); }
  if (S.grid[cell] !== 0) { setMsg(`${cellName(cell)} ya tiene un número.`, 'warn'); return render(); }
  const hit = S.singles.find(s => s.cell === cell && s.digit === d);
  if (hit) {
    S.grid[cell] = d; S.cands[cell] = 0;
    S.flow.log.push(`Colocaste ${d} en ${cellName(cell)}`);
    setMsg(`¡Exacto! ${singleText(hit)} Esto es lo que desbloqueó la técnica.`, 'success');
    advance(); saveProgress(); render(); $('panelCol').scrollTop = 0; return;
  }
  const clash = PEERS[cell].find(p => S.grid[p] === d);
  if (clash !== undefined) setMsg(`No puede ser: ya hay un ${d} en ${cellName(clash)}, que comparte fila, columna o región.`, 'error');
  else setMsg(`Todavía no se puede asegurar el ${d} en ${cellName(cell)}. Busca una casilla con un solo candidato, o un número que solo quepa en un sitio de una fila, columna o región.`, 'warn');
  render();
}

// ------------------------------------------------------------------ visuals
function getVis() {
  const none = { regions: false, cells: false, cands: false, links: false, targets: false, applied: false };
  if (!S.step) return none;
  if (S.stage === 'A') return { regions: true, cells: true, cands: true, links: true, targets: true, applied: false };
  if (S.stage === 'B') {
    const e = S.ped.eightSteps[S.obsIdx];
    return { regions: e.showRegions, cells: e.showCells, cands: e.showCands, links: e.showLinks, targets: S.obsIdx === 5, applied: S.obsIdx >= 6 };
  }
  const st = curStep();
  const end = st === 'single' || st === 'done';
  if (S.flow && S.flow.kind === 'practice') {
    const cellsDone = passed('cells');
    return {
      regions: (passed('zone') || cellsDone) && !end, cells: cellsDone, cands: cellsDone, links: cellsDone && !end,
      targets: S.showTargets && st === 'elim', applied: end
    };
  }
  const cellsOk = passed('cells');
  return {
    regions: S.hint >= 1 && !end, cells: S.hint >= 3 || cellsOk, cands: S.hint >= 4 || cellsOk,
    links: (S.hint >= 4 || cellsOk) && !end, targets: S.hint >= 4 && st === 'elim', applied: end
  };
}

  'role-fin': ['Aleta', '#fce7f3', '#db2777'], 'role-target': ['Casilla afectada', '#fee2e2', '#dc2626'],

  link: ['Línea = conexión lógica', '#fff', '#0284c7']

function renderFilterBar() {
  const placed = d => S.grid.filter(v => v === d).length;
  $('filterBar').innerHTML = `<span class="fl">Resaltar</span>` +
    [1, 2, 3, 4, 5, 6, 7, 8, 9].map(d => `<button class="mono ${S.filter === d ? 'on' : ''} ${placed(d) === 9 ? 'full' : ''}" data-filter="${d}" aria-label="Resaltar el ${d}">${d}</button>`).join('') +
    `<button class="clr" data-filter="0" aria-label="Quitar resaltado" ${S.filter ? '' : 'disabled'}>✕</button>`;
}

function renderBoard() {
  const vis = getVis();
  const st = S.step;
  const used = new Set();
  const pattern = new Set(vis.cells && st ? st.patternCells : []);
  const targetsArr = st && st.eliminations ? st.eliminations : [];
  const targetCells = new Set(vis.targets ? targetsArr.map(e => e.cell) : []);
  const picked = new Set(S.picked);
  const roles = (st && st.roles) || {};
  const zone = new Set();
  if (vis.regions && st && st.regions) for (const r of st.regions) for (const c of unitCells(r)) zone.add(c);
  const pDigits = st ? (st.digits || (st.digit ? [st.digit] : [])) : [];
  let single = null;
  if (S.singleShown) single = S.singleShown.cell;
  if (S.stage === 'B' && S.obsIdx === 7 && S.bSingle) single = S.bSingle.cell;
  const sel = S.selected, peers = sel >= 0 ? new Set(PEERS[sel]) : new Set();

  const frag = document.createDocumentFragment();
  for (let i = 0; i < 81; i++) {
    const r = CELL_ROW[i], c = CELL_COL[i], b = CELL_BOX[i];
    const el = document.createElement('div');
    const cls = ['cell'];
    if (c === 2 || c === 5) cls.push('br'); if (r === 2 || r === 5) cls.push('bb');
    if (c === 8) cls.push('c8'); if (r === 8) cls.push('r8');
    if (b % 2 === 1) cls.push('alt');
    if (i === sel) cls.push('sel'); else if (peers.has(i)) cls.push('peer');
    if (S.filter && S.grid[i] === S.filter) { cls.push('same'); used.add('same'); }
    if (zone.has(i)) { cls.push('zone'); used.add('zone'); }
    if (picked.has(i)) { cls.push('picked'); used.add('picked'); }
    if (i === single) { cls.push('role-single'); used.add('role-single'); }
    else if (pattern.has(i)) { const rc = 'role-' + (LEGEND['role-' + roles[i]] ? roles[i] : 'pattern'); cls.push(rc); used.add(rc); }
    else if (targetCells.has(i)) { cls.push('role-target'); used.add('role-target'); }
    el.className = cls.join(' ');

    if (S.grid[i]) {
      el.innerHTML = `<span class="v mono ${S.givens[i] ? 'given' : 'placed'}">${S.grid[i]}</span>`;
    } else {
      let h = '<div class="cands mono">';
      for (let d = 1; d <= 9; d++) {
        const isT = targetsArr.some(e => e.cell === i && e.digit === d);
        const wasE = S.eliminated.some(e => e.cell === i && e.digit === d) || (vis.applied && isT);
        const has = (S.cands[i] & (1 << d)) !== 0;
        let k = '', txt = '';
        if (wasE) { k = 'x'; txt = d; used.add('cdx'); }
        else if (has) {
          txt = d;
          if (vis.targets && isT) { k = 't'; used.add('cdt'); }
          else if (vis.cands && pattern.has(i) && pDigits.includes(d)) { k = 'p'; used.add('cdp'); }
          else if (S.filter === d) { k = 'f'; used.add('cdf'); }
        }
        h += `<div class="cd ${k}">${txt}</div>`;
      }
      el.innerHTML = h + '</div>';
    }
    el.addEventListener('click', () => onCell(i));
    frag.appendChild(el);
  }
  const g = $('grid'); g.innerHTML = ''; g.appendChild(frag);
  if (vis.links && st && st.links && st.links.length) used.add('link');
  renderOverlay(vis);
  $('legend').innerHTML = [...used].filter(k => LEGEND[k]).map(k => {
    const [t, bg, bd] = LEGEND[k];
    return `<span><i style="background:${bg};border-color:${bd}"></i>${t}</span>`;
  }).join('') || '<span class="small">Toca una casilla para ver su fila, columna y región.</span>';
}

function candXY(cell, digit) {
  const r = CELL_ROW[cell], c = CELL_COL[cell];
  if (!digit || S.grid[cell] !== 0) return { x: c * 100 + 50, y: r * 100 + 50 };
  return { x: c * 100 + 20 + ((digit - 1) % 3) * 30, y: r * 100 + 20 + Math.floor((digit - 1) / 3) * 30 };
}
function renderOverlay(vis) {
  const svg = $('overlay'); svg.innerHTML = '';
  if (!vis.links || !S.step) return;
  let h = `<defs><marker id="aS" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#0284c7"/></marker><marker id="aW" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="#d97706"/></marker></defs>`;
  for (const l of S.step.links || []) {
    const a = candXY(l.fromCell, l.fromDigit), b = candXY(l.toCell, l.toDigit);
    h += l.type === 'strong'
      ? `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#0284c7" stroke-width="6" stroke-opacity=".85" marker-end="url(#aS)"/>`
      : `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#d97706" stroke-width="5" stroke-dasharray="8 6" stroke-opacity=".85" marker-end="url(#aW)"/>`;
  }
  svg.innerHTML = h;
}

const progressBar = (n, i) => `<div class="progress">${Array.from({ length: n }, (_, k) => `<i class="${k < i ? 'ok' : k === i ? 'on' : ''}"></i>`).join('')}</div>`;

function panelLearn(meta) {
  const simple = SIMPLE_EXPLAIN[S.techId] || meta.problemSolved || meta.concept;

  } else if (st === 'elim') {

    card = `<div class="box blue"><b class="t">Tacha los candidatos imposibles</b>
      <div class="p">Toca una casilla y luego el número a tachar.</div>

  } else {
    const r = f.result || { pass: false, reasons: [] };
    const p = prog();
    let next = '';
    if (S.free) next = `<div class="box"><b class="t">Era: ${meta.name}</b><div class="p">${S.step.summary}</div></div><div class="row"><button class="btn pri grow" data-act="nextFree">Siguiente tablero →</button></div><button class="btn ghost sm" data-act="learnThis">📖 Estudiar esta técnica</button>`;

    else if (r.pass) {
      const miss = [];
      if (!p.learnedTheory) miss.push('Entender'); if (!p.observedExample) miss.push('Ejemplo (hasta el paso 8)'); if (!p.guidedPracticeDone) miss.push('Practicar (sin “Hazlo por mí”)');

      next = `<div class="box amber"><b class="t">Casi dominada</b><div class="p">Te falta: ${miss.join(', ')}.</div></div>`;

}

function startFree() {
  if (!S.freeQueue.length) {
    const all = [];
    for (const t of TECHNIQUE_ORDER) for (const b of [0, 1, 2]) all.push({ techId: t.id, ref: 'b' + b });
    S.freeQueue = shuffle(all);
  }
  const it = S.freeQueue.shift();
  closeMenu();
  loadExercise(it.techId, it.ref, 'D', true);
}
function runAudit() {
  let ok = 0, bad = [];
  TECHNIQUE_ORDER.forEach((t, rank) => VERIFIED_LIBRARY[t.id].forEach(ex => { const r = validateExerciseRecord(ex, rank); if (r.valid) ok++; else bad.push(`${ex.id}: ${r.reason}`); }));
  $('auditOut').innerHTML = `${ok} / 69 tableros verificados.` + (bad.length ? '<br>' + bad.join('<br>') : ' Todo correcto ✓');
}

// ------------------------------------------------------------------ actualizaciones
const enApk = () => /^\d+\.\d+\.\d+$/.test(APP_VERSION);
function cmpVer(a, b) { const x = a.split('.').map(Number), y = b.split('.').map(Number); for (let i = 0; i < 3; i++) if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) - (y[i] || 0); return 0; }
async function buscarActualizacion(manual = false) {
  if (!enApk()) { if (manual) { S.updMsg = 'Las actualizaciones solo se revisan dentro de la app instalada (APK).'; renderMenu(); } return; }
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/releases/latest`, { headers: { Accept: 'application/vnd.github+json' }, cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const rel = await r.json();
    const nueva = String(rel.tag_name || '').replace(/^v/, '');
    try { localStorage.setItem('sudoku_upd_check', String(Date.now())); } catch (e) {}
    if (/^\d+\.\d+\.\d+$/.test(nueva) && cmpVer(nueva, APP_VERSION) > 0) {
      const notas = String(rel.body || '').replace(/^#+.*$/gm, '').replace(/\*\*/g, '').trim();
      $('updBar').innerHTML = `<div class="t">⬆️ Nueva versión ${nueva} disponible</div>${notas ? `<div class="d">${notas.replace(/</g, '&lt;')}</div>` : ''}
        <div class="row"><a href="${APK_URL}">Descargar e instalar</a><button data-upd="later">Luego</button></div>
        <div style="font-size:11.5px;opacity:.9">Se descarga en el navegador; al terminar, toca la notificación para instalar. Tu progreso se conserva.</div>`;
      $('updBar').classList.remove('hidden');
      S.updMsg = `Hay una versión nueva: ${nueva}.`;
    } else S.updMsg = `Tienes la última versión (${APP_VERSION}).`;
  } catch (e) {
    S.updMsg = 'No se pudo revisar (¿sin internet?). Se intentará de nuevo al abrir la app.';
  }
  if (manual) renderMenu();
}

function stopPlay() { if (S.playTimer) { clearInterval(S.playTimer); S.playTimer = null; } }
function setObs(k) {
  S.obsIdx = Math.max(0, Math.min(7, k));
  if (S.obsIdx === 7) {
    const p = prog(); if (p && !p.observedExample) { p.observedExample = true; recompute(); saveProgress(); }
    if (!S.bSingleFor || S.bSingleFor !== S.ex.id) {
      const after = S.cands.slice();
      for (const e of S.step.eliminations) after[e.cell] &= ~(1 << e.digit);
      S.bSingle = findSingles(S.grid, after)[0] || null; S.bSingleFor = S.ex.id;
    }
  }
  render();
  $('panelCol').scrollTop = 0;
}

// ------------------------------------------------------------------ events
const ACTIONS = {
  closeMsg() { S.msg = null; render(); },
  toExample() { loadExercise(S.techId, 'b0', 'B'); },
  toTheory() { loadExercise(S.techId, 'b0', 'A'); },
  toPractice() { loadExercise(S.techId, 'b1', 'C'); },
  toEval() { loadExercise(S.techId, 'b2', 'D'); },
  toEval2() { loadExercise(S.techId, 'iso', 'E'); },
  retryEval() { loadExercise(S.techId, S.ref, S.stage); },
  otherExample() { loadExercise(S.techId, nextVariantRef(0), 'B'); },
  newPractice() { loadExercise(S.techId, nextVariantRef(1), 'C'); },
  obsPrev() { stopPlay(); setObs(S.obsIdx - 1); },
  obsNext() { stopPlay(); setObs(S.obsIdx + 1); },
  play() {
    if (S.playTimer) { stopPlay(); return render(); }
    if (S.obsIdx >= 7) S.obsIdx = 0;
    S.playTimer = setInterval(() => { if (S.stage !== 'B' || S.obsIdx >= 7) { stopPlay(); return render(); } setObs(S.obsIdx + 1); if (S.obsIdx >= 7) { stopPlay(); render(); } }, 3500);
    render();
  },
  showCells() {
    S.picked = S.step.patternCells.slice();
    setMsg(`Estas son: ${S.ped.pNames.join(', ')}. Ahora pulsa Comprobar.`, 'info');
    render();
  },
  clearPicks() { S.picked = []; render(); },
  checkCells() {
    const exp = S.step.patternCells, pk = S.picked;
    const extra = pk.filter(c => !exp.includes(c)), missing = exp.filter(c => !pk.includes(c));
    const meta = TECHNIQUE_META[S.techId];
    const practice = S.flow.kind === 'practice';
    if (!extra.length && !missing.length) {
      if (practice) recordPractice(true);
      S.flow.log.push(`Patrón: ${S.ped.pNames.join(', ')}`);
      S.picked = []; advance();
      setMsg(practice ? '¡Exacto! Esas son las casillas del patrón. Mira cómo se colorean.' : '¡Celdas correctas!', 'success');
    } else {
      if (practice) recordPractice(false); else { S.flow.mistakes++; S.progress.stats.errorsCount++; saveProgress(); }
      if (extra.length) setMsg(`${cellName(extra[0])} no forma parte del patrón: sus candidatos {${bitsToDigits(S.cands[extra[0]]).join(', ')}} no participan en ${practice ? meta.shortName : 'esta técnica'}.`, 'warn');
      else setMsg(`Te ${missing.length === 1 ? 'falta 1 casilla' : `faltan ${missing.length} casillas`} del patrón.${practice ? ` Mira cerca de ${cellName(missing[0])}.` : ''}`, 'warn');
    }
    render(); $('panelCol').scrollTop = 0;
  },
  showTargets() { S.showTargets = true; S.hint = Math.max(S.hint, 4); setMsg('En rojo: los candidatos a tachar. Toca la casilla y luego el número.', 'info'); render(); },
  applyForMe() { applyForMe(); },
  undo() { undo(); },
  showSingle() {
    S.singleShown = S.singles[0];
    setMsg(`${singleText(S.singleShown)} Tócala y pon el ${S.singleShown.digit}.`, 'info');
    S.selected = S.singleShown.cell; render();
  },
  skipSingle() { advance(); S.msg = null; render(); },
  hint() {
    if (S.hint >= 4) return;
    S.hint++; S.progress.stats.hintsUsed++; saveProgress(); render();
  },
  nextFree() { startFree(); },
  learnThis() { loadExercise(S.techId, 'b0', 'A', false); },
  nextTech() { const k = rankOf(S.techId); loadExercise(TECHNIQUE_ORDER[(k + 1) % TECHNIQUE_ORDER.length].id, 'b0', 'A'); },
  startFree() { startFree(); },
  audit() { runAudit(); },
  checkUpd() { S.updMsg = 'Revisando…'; renderMenu(); buscarActualizacion(true); },
  resetAll() {
    if (!S.confirmReset) { S.confirmReset = true; return renderMenu(); }
    try { localStorage.removeItem(STORAGE_KEY); localStorage.removeItem('sudoku_academy_progress_v1'); } catch (e) {}
    S.progress = { techniques: {}, stats: freshStats() }; initDefaultProgress(); saveProgress();
    S.confirmReset = false; renderMenu(); render();
  }
};
function recordPractice(ok) {
  const p = prog();
  p.practiceAttempts++; if (ok) p.practiceCorrect++; else { p.practiceErrors++; S.progress.stats.errorsCount++; }
  saveProgress();
}

function onPanelClick(e) {
  const t = e.target.closest('button'); if (!t || t.disabled) return;
  const f = S.flow;
  if (t.dataset.act && ACTIONS[t.dataset.act]) return ACTIONS[t.dataset.act]();
  if (t.dataset.obs !== undefined) { stopPlay(); return setObs(Number(t.dataset.obs)); }
  if (t.dataset.digit) return onDigit(Number(t.dataset.digit));
  if (t.dataset.qDigit) {
    const d = Number(t.dataset.qDigit);
    S.filter = d;
    if (f.keyDigits.includes(d)) {
      recordPractice(true);
      const all = S.step.digits && S.step.digits.length > 1 ? ` El patrón usa {${S.step.digits.join(', ')}}.` : '';
      f.log.push(`Número clave: ${d}`); advance();
      setMsg(`¡Sí! El ${d} está en azul en el tablero.${all}`, 'success');
    } else {
      recordPractice(false); f.wrong['d' + d] = true;
      setMsg(`No es el ${d}. Ahora ves sus posiciones en azul: ¿forman un patrón? Prueba con otro número.`, 'warn');
    }
    render(); $('panelCol').scrollTop = 0; return;
  }
  if (t.dataset.qZone) {
    const o = f.zoneOptions.find(x => x.id === t.dataset.qZone);
    if (o.id === 'ok') { recordPractice(true); f.log.push(`Zona: ${o.text}`); advance(); setMsg('¡Bien! La zona está pintada en azul claro.', 'success'); }
    else { recordPractice(false); f.wrong[o.id] = true; setMsg('Ahí no se concentran las posiciones del número. Mira dónde quedan agrupadas las casillas azules.', 'warn'); }
    render(); $('panelCol').scrollTop = 0; return;
  }
  if (t.dataset.qTech) {
    const id = t.dataset.qTech;
    if (id === S.techId) {
      S.progress.stats.identifiedCount++; S.progress.stats.score += 40;
      f.log.push(`Técnica: ${TECHNIQUE_META[id].shortName}`); advance();
      f.whyOptions = makeWhyOptions();
      setMsg(`¡Correcto! Es ${TECHNIQUE_META[id].name}.`, 'success');
    } else {
      f.techFirstTry = false; f.wrong[id] = true; S.progress.stats.errorsCount++;
      setMsg(`No es ${TECHNIQUE_META[id].shortName}: aquí no se cumple su condición (${TECHNIQUE_META[id].conditions})`, 'warn');
    }
    saveProgress(); render(); $('panelCol').scrollTop = 0; return;
  }
  if (t.dataset.qWhy) {
    if (t.dataset.qWhy === 'ok') { f.log.push('Justificación correcta'); advance(); setMsg('¡Bien razonado! Ahora haz las eliminaciones.', 'success'); }
    else { f.wrong[t.dataset.qWhy] = true; f.mistakes++; S.progress.stats.errorsCount++; saveProgress(); setMsg('No. En Sudoku nunca se elimina “probando”: siempre es porque un patrón lo hace imposible.', 'warn'); }
    render(); $('panelCol').scrollTop = 0; return;
  }
}

function bind() {
  $('filterBar').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    const d = Number(b.dataset.filter);
    S.filter = S.filter === d ? 0 : d;
    renderBoard(); renderFilterBar();
  });
  $('updBar').addEventListener('click', e => { if (e.target.closest('[data-upd="later"]')) $('updBar').classList.add('hidden'); });
  $('panel').addEventListener('click', onPanelClick);
  $('dock').addEventListener('click', onPanelClick);
  $('menuMap').addEventListener('click', e => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.open) { closeMenu(); loadExercise(t.dataset.open, 'b0', 'A'); }
    else if (t.dataset.act) ACTIONS[t.dataset.act]();
  });
  $('menuStats').addEventListener('click', e => { const t = e.target.closest('button'); if (t && t.dataset.act) ACTIONS[t.dataset.act](); });
  document.querySelectorAll('[data-mtab]').forEach(b => b.addEventListener('click', () => { S.menuTab = b.dataset.mtab; S.confirmReset = false; renderMenu(); }));
  $('menuBtn').addEventListener('click', openMenu);
  $('menuClose').addEventListener('click', closeMenu);
  $('boardSizeBtn').addEventListener('click', () => { S.boardSize = { M: 'L', L: 'S', S: 'M' }[S.boardSize]; saveProgress(); renderHeader(); });
  $('stageTabs').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const t = b.dataset.tab;
    if (t === 'A') ACTIONS.toTheory(); else if (t === 'B') ACTIONS.toExample(); else if (t === 'C') ACTIONS.toPractice(); else ACTIONS.toEval();
  });
  window.addEventListener('keydown', e => {
    if (!$('menu').classList.contains('hidden')) { if (e.key === 'Escape') closeMenu(); return; }
    if (e.key >= '1' && e.key <= '9') { e.preventDefault(); onDigit(Number(e.key)); }
    else if (e.key.startsWith('Arrow')) {
      e.preventDefault();
      if (S.stage === 'B') { if (e.key === 'ArrowRight') ACTIONS.obsNext(); if (e.key === 'ArrowLeft') ACTIONS.obsPrev(); return; }
      const s = S.selected < 0 ? 40 : S.selected;
      S.selected = { ArrowRight: (s + 1) % 81, ArrowLeft: (s + 80) % 81, ArrowDown: (s + 9) % 81, ArrowUp: (s + 72) % 81 }[e.key];
      render();
    } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
  });
  $('lblCol').innerHTML = Array.from({ length: 9 }, (_, i) => `<span>${i + 1}</span>`).join('');
  $('lblRow').innerHTML = Array.from({ length: 9 }, (_, i) => `<span>${i + 1}</span>`).join('');
}

window.addEventListener('load', () => {
  loadProgress();
  bind();
  loadExercise(S.techId, 'b0', 'A');
  setInterval(() => { S.exSec++; }, 1000);
  setTimeout(() => buscarActualizacion(false), 1500);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    let last = 0; try { last = Number(localStorage.getItem('sudoku_upd_check') || 0); } catch (e) {}
    if (Date.now() - last > 6 * 3600 * 1000) buscarActualizacion(false);
  });
});

</script>
