            };
          }
        }
      }
    }
  }
  return null;
}

// 4. Naked Triples
function detectNakedTriples(grid, cands) {
  for (const unit of UNITS) {
    const candCells = unit.cells.filter(c => grid[c] === 0 && countBits(cands[c]) >= 2 && countBits(cands[c]) <= 3);
    if (candCells.length < 3) continue;
    for (const [c1, c2, c3] of combinations(candCells, 3)) {
      const unionMask = cands[c1] | cands[c2] | cands[c3];
      if (countBits(unionMask) === 3) {
        const digits = bitsToDigits(unionMask);
        const elims = [];
        for (const c of unit.cells) {
          if (c !== c1 && c !== c2 && c !== c3 && grid[c] === 0 && (cands[c] & unionMask)) {
            for (const d of digits) if (cands[c] & (1 << d)) elims.push({ cell: c, digit: d });
          }
        }
        if (elims.length > 0) {
          return {
            techniqueId: 'naked_triples',
            digits,
            patternCells: [c1, c2, c3],
            eliminations: elims,
            regions: [{ type: unit.type, index: unit.index }],
            links: [],
            summary: `En ${unit.name}, las tres celdas ${cellName(c1)}, ${cellName(c2)} y ${cellName(c3)} restringen entre sí los tres dígitos {${digits.join(', ')}}. Estos candidatos se eliminan del resto de ${unit.name}.`
          };
        }
      }
    }
  }
  return null;
}

// 5. Hidden Triples
function detectHiddenTriples(grid, cands) {
  for (const unit of UNITS) {
    const candidateDigits = [];
    const digitCellMap = {};
    for (let d = 1; d <= 9; d++) {
      const bit = 1 << d;
      const cells = unit.cells.filter(c => grid[c] === 0 && (cands[c] & bit));
      if (cells.length >= 2 && cells.length <= 3) {
        candidateDigits.push(d);
        digitCellMap[d] = cells;
      }
    }
    if (candidateDigits.length < 3) continue;
    for (const [d1, d2, d3] of combinations(candidateDigits, 3)) {
      const cellSet = new Set([...digitCellMap[d1], ...digitCellMap[d2], ...digitCellMap[d3]]);
      if (cellSet.size === 3) {
        const cells = [...cellSet];
        const tripleMask = (1 << d1) | (1 << d2) | (1 << d3);
        const elims = [];
        for (const c of cells) {
          const extra = cands[c] & ~tripleMask;
          for (const ed of bitsToDigits(extra)) elims.push({ cell: c, digit: ed });
        }
        if (elims.length > 0) {
          return {
            techniqueId: 'hidden_triples',
            digits: [d1, d2, d3],
            patternCells: cells,
            eliminations: elims,
            regions: [{ type: unit.type, index: unit.index }],
            links: [],
            summary: `En ${unit.name}, los dígitos {${d1}, ${d2}, ${d3}} solo aparecen en las celdas ${cells.map(cellName).join(', ')}. Todos los demás candidatos en esas tres celdas pueden eliminarse.`
          };
        }
      }
    }
  }
  return null;
}

// 6, 7, 8. Fish (X-Wing = 2, Swordfish = 3, Jellyfish = 4)
function detectFish(grid, cands, size, techId, techLabel) {
  for (let d = 1; d <= 9; d++) {
    const bit = 1 << d;
    // Row base -> Col cover
    const validRows = [];
    for (let r = 0; r < 9; r++) {
      const cols = [];
      for (let c = 0; c < 9; c++) if (grid[r*9+c] === 0 && (cands[r*9+c] & bit)) cols.push(c);
      if (cols.length >= 2 && cols.length <= size) validRows.push({ r, cols });
    }
    if (validRows.length >= size) {
      for (const combo of combinations(validRows, size)) {
        const colSet = new Set();
        const patternCells = [];
        for (const item of combo) {
          for (const c of item.cols) {
            colSet.add(c);
            patternCells.push(item.r * 9 + c);
          }
        }
        if (colSet.size === size) {
          const baseRows = new Set(combo.map(x => x.r));
          const coverCols = [...colSet];
          const elims = [];
          for (const c of coverCols) {
            for (let r = 0; r < 9; r++) {
              const idx = r * 9 + c;
              if (!baseRows.has(r) && grid[idx] === 0 && (cands[idx] & bit)) {
                elims.push({ cell: idx, digit: d });
              }
            }
          }
          if (elims.length > 0) {
            const links = [];
            for (const item of combo) {
              for (let k = 0; k < item.cols.length - 1; k++) {
                links.push({
                  fromCell: item.r * 9 + item.cols[k],
                  fromDigit: d,
                  toCell: item.r * 9 + item.cols[k+1],
                  toDigit: d,
                  type: 'strong'
                });
              }
            }
            return {
              techniqueId: techId,
              digit: d,
              patternCells,
              eliminations: elims,
              regions: [
                ...[...baseRows].map(r => ({ type: 'row', index: r })),
                ...coverCols.map(c => ({ type: 'col', index: c }))
              ],
              links,
              summary: `${techLabel} sobre el candidato ${d}: en las filas ${[...baseRows].map(r=>r+1).join(', ')}, el dígito ${d} solo aparece en las columnas ${coverCols.map(c=>c+1).join(', ')}. Se elimina ${d} del resto de esas columnas.`
            };
          }
        }
      }
    }
    // Col base -> Row cover
    const validCols = [];
    for (let c = 0; c < 9; c++) {
      const rows = [];
      for (let r = 0; r < 9; r++) if (grid[r*9+c] === 0 && (cands[r*9+c] & bit)) rows.push(r);
      if (rows.length >= 2 && rows.length <= size) validCols.push({ c, rows });
    }
    if (validCols.length >= size) {
      for (const combo of combinations(validCols, size)) {
        const rowSet = new Set();
        const patternCells = [];
        for (const item of combo) {
          for (const r of item.rows) {
            rowSet.add(r);
            patternCells.push(r * 9 + item.c);
          }
        }
        if (rowSet.size === size) {
          const baseCols = new Set(combo.map(x => x.c));
          const coverRows = [...rowSet];
          const elims = [];
          for (const r of coverRows) {
            for (let c = 0; c < 9; c++) {
              const idx = r * 9 + c;
              if (!baseCols.has(c) && grid[idx] === 0 && (cands[idx] & bit)) {
                elims.push({ cell: idx, digit: d });
              }
            }
          }
          if (elims.length > 0) {
            const links = [];
            for (const item of combo) {
              for (let k = 0; k < item.rows.length - 1; k++) {
                links.push({
                  fromCell: item.rows[k] * 9 + item.c,
                  fromDigit: d,
                  toCell: item.rows[k+1] * 9 + item.c,
                  toDigit: d,
                  type: 'strong'
                });
              }
            }
            return {
              techniqueId: techId,
              digit: d,
              patternCells,
              eliminations: elims,
              regions: [
                ...[...baseCols].map(c => ({ type: 'col', index: c })),
                ...coverRows.map(r => ({ type: 'row', index: r }))
              ],
              links,
              summary: `${techLabel} sobre el candidato ${d}: en las columnas ${[...baseCols].map(c=>c+1).join(', ')}, el dígito ${d} solo aparece en las filas ${coverRows.map(r=>r+1).join(', ')}. Se elimina ${d} del resto de esas filas.`
            };
          }
        }
      }
    }
  }
  return null;
}

// 9. XY-Wing
function detectXYWing(grid, cands) {
  const biCells = [];
  for (let i = 0; i < 81; i++) if (grid[i] === 0 && countBits(cands[i]) === 2) biCells.push(i);
  for (const pivot of biCells) {
    const [x, y] = bitsToDigits(cands[pivot]);
    const peerBi = biCells.filter(c => sees(pivot, c));
    for (let i = 0; i < peerBi.length; i++) {
      for (let j = i + 1; j < peerBi.length; j++) {
        const p1 = peerBi[i], p2 = peerBi[j];
        const union = cands[pivot] | cands[p1] | cands[p2];
        if (countBits(union) !== 3) continue;
        if (cands[p1] === cands[pivot] || cands[p2] === cands[pivot] || cands[p1] === cands[p2]) continue;
        const zMask = (cands[p1] & cands[p2]) & ~cands[pivot];
        if (countBits(zMask) !== 1) continue;
        const z = bitsToDigits(zMask)[0];
        const x1 = bitsToDigits(cands[p1] & ~zMask)[0];
        const y1 = bitsToDigits(cands[p2] & ~zMask)[0];
        const elims = [];
        for (let t = 0; t < 81; t++) {
          if (t !== pivot && t !== p1 && t !== p2 && grid[t] === 0 && (cands[t] & zMask) && sees(t, p1) && sees(t, p2)) {
            elims.push({ cell: t, digit: z });
          }
        }
        if (elims.length > 0) {
          return {
            techniqueId: 'xy_wing',
            digit: z,
            digits: [x, y, z],
            patternCells: [pivot, p1, p2],
            roles: { [pivot]: 'pivot', [p1]: 'pincer', [p2]: 'pincer' },
            eliminations: elims,
            regions: [],
            links: [
              { fromCell: pivot, fromDigit: x1, toCell: p1, toDigit: x1, type: 'weak' },
              { fromCell: pivot, fromDigit: y1, toCell: p2, toDigit: y1, type: 'weak' },
              { fromCell: p1, fromDigit: x1, toCell: p1, toDigit: z, type: 'strong' },
              { fromCell: p2, fromDigit: y1, toCell: p2, toDigit: z, type: 'strong' }
            ],
            summary: `XY-Wing con pivote en ${cellName(pivot)} {${x},${y}} y pinzas en ${cellName(p1)} {${x1},${z}} y ${cellName(p2)} {${y1},${z}}. Al menos una pinza contiene ${z}, eliminando ${z} de toda celda que vea a ambas pinzas.`
          };
        }
      }
    }
  }
  return null;
}

// 10. XYZ-Wing
function detectXYZWing(grid, cands) {
  const triCells = [], biCells = [];
  for (let i = 0; i < 81; i++) {
    if (grid[i] === 0) {
      const cnt = countBits(cands[i]);
      if (cnt === 3) triCells.push(i);
      else if (cnt === 2) biCells.push(i);
    }
  }
  for (const pivot of triCells) {
    const pMask = cands[pivot];
    const peerBi = biCells.filter(c => sees(pivot, c) && (cands[c] & ~pMask) === 0);
    for (let i = 0; i < peerBi.length; i++) {
      for (let j = i + 1; j < peerBi.length; j++) {
        const p1 = peerBi[i], p2 = peerBi[j];
        if (cands[p1] === cands[p2]) continue;
        const zMask = cands[p1] & cands[p2];
        if (countBits(zMask) !== 1) continue;
        const z = bitsToDigits(zMask)[0];
        const elims = [];
        for (let t = 0; t < 81; t++) {
          if (t !== pivot && t !== p1 && t !== p2 && grid[t] === 0 && (cands[t] & zMask) && sees(t, pivot) && sees(t, p1) && sees(t, p2)) {
            elims.push({ cell: t, digit: z });
          }
        }
        if (elims.length > 0) {
          const digits = bitsToDigits(pMask);
          return {
            techniqueId: 'xyz_wing',
            digit: z,
            digits,
            patternCells: [pivot, p1, p2],
            roles: { [pivot]: 'pivot', [p1]: 'pincer', [p2]: 'pincer' },
            eliminations: elims,
            regions: [],
            links: [
              { fromCell: pivot, fromDigit: z, toCell: p1, toDigit: z, type: 'weak' },
              { fromCell: pivot, fromDigit: z, toCell: p2, toDigit: z, type: 'weak' }
            ],
            summary: `XYZ-Wing con pivote trivaluado en ${cellName(pivot)} {${digits.join(',')}} y pinzas en ${cellName(p1)} y ${cellName(p2)} compartiendo el candidato ${z}. Cualquier celda que vea simultáneamente al pivote y a las dos pinzas no puede contener ${z}.`
          };
        }
      }
    }
  }
  return null;
}

// 11. W-Wing
function detectWWing(grid, cands) {
  const biCells = [];
  for (let i = 0; i < 81; i++) if (grid[i] === 0 && countBits(cands[i]) === 2) biCells.push(i);
  for (let i = 0; i < biCells.length; i++) {
    for (let j = i + 1; j < biCells.length; j++) {
      const c1 = biCells[i], c2 = biCells[j];
      if (cands[c1] !== cands[c2] || sees(c1, c2)) continue;
      const [d1, d2] = bitsToDigits(cands[c1]);
      for (const [linkDigit, elimDigit] of [[d1, d2], [d2, d1]]) {
        const linkBit = 1 << linkDigit;
        const elimBit = 1 << elimDigit;
        for (const unit of UNITS) {
          const uCells = unit.cells.filter(c => grid[c] === 0 && (cands[c] & linkBit));
          if (uCells.length !== 2) continue;
          const [s1, s2] = uCells;
          if (s1 === c1 || s1 === c2 || s2 === c1 || s2 === c2) continue;
          if ((sees(c1, s1) && sees(c2, s2)) || (sees(c1, s2) && sees(c2, s1))) {
            const a = sees(c1, s1) ? s1 : s2;
            const b = sees(c1, s1) ? s2 : s1;
            const elims = [];
            for (let t = 0; t < 81; t++) {
              if (t !== c1 && t !== c2 && grid[t] === 0 && (cands[t] & elimBit) && sees(t, c1) && sees(t, c2)) {
                elims.push({ cell: t, digit: elimDigit });
              }
            }
            if (elims.length > 0) {
              return {
                techniqueId: 'w_wing',
                digit: elimDigit,
                digits: [linkDigit, elimDigit],
                patternCells: [c1, c2, a, b],
                roles: { [c1]: 'pincer', [c2]: 'pincer', [a]: 'bridge', [b]: 'bridge' },
                eliminations: elims,
                regions: [{ type: unit.type, index: unit.index }],
                links: [
                  { fromCell: c1, fromDigit: linkDigit, toCell: a, toDigit: linkDigit, type: 'weak' },
                  { fromCell: a, fromDigit: linkDigit, toCell: b, toDigit: linkDigit, type: 'strong' },
                  { fromCell: b, fromDigit: linkDigit, toCell: c2, toDigit: linkDigit, type: 'weak' }
                ],
                summary: `W-Wing entre las celdas bivaluadas ${cellName(c1)} y ${cellName(c2)} {${d1},${d2}}, conectadas mediante el enlace fuerte del dígito ${linkDigit} en ${unit.name} (${cellName(a)}—${cellName(b)}). Se elimina ${elimDigit} de las celdas que ven a ${cellName(c1)} y ${cellName(c2)}.`
              };
            }
          }
        }
      }
    }
  }
  return null;
}



// Helper: get all conjugate pairs (strong links in a unit) for digit d
function getConjugatePairs(grid, cands, d) {
  const bit = 1 << d;
  const pairs = [];
  for (const unit of UNITS) {
    const cells = unit.cells.filter(c => grid[c] === 0 && (cands[c] & bit));
    if (cells.length === 2) {
      pairs.push({ u: cells[0], v: cells[1], unit });
    }
  }
  return pairs;
}

// 14. Skyscraper
function detectSkyscraper(grid, cands) {
  for (let d = 1; d <= 9; d++) {
    const bit = 1 << d;
    // Row-based Skyscraper
    const rowPairs = [];
    for (let r = 0; r < 9; r++) {
      const cells = ROWS[r].filter(c => grid[c] === 0 && (cands[c] & bit));
      if (cells.length === 2) rowPairs.push({ r, cells });
    }
    for (let i = 0; i < rowPairs.length; i++) {
      for (let j = i + 1; j < rowPairs.length; j++) {
        const A = rowPairs[i], B = rowPairs[j];
        for (const [idxABase, idxARoof] of [[0,1], [1,0]]) {
          for (const [idxBBase, idxBRoof] of [[0,1], [1,0]]) {
            const baseA = A.cells[idxABase], roofA = A.cells[idxARoof];
            const baseB = B.cells[idxBBase], roofB = B.cells[idxBRoof];
            if (CELL_COL[baseA] === CELL_COL[baseB] && CELL_COL[roofA] !== CELL_COL[roofB]) {
              const pCells = [baseA, roofA, baseB, roofB];
              const elims = [];
              for (let t = 0; t < 81; t++) {
                if (!pCells.includes(t) && grid[t] === 0 && (cands[t] & bit) && sees(t, roofA) && sees(t, roofB)) {
                  elims.push({ cell: t, digit: d });
                }
              }
              if (elims.length > 0) {
                return {
                  techniqueId: 'skyscraper',
                  digit: d,
                  patternCells: pCells,
                  roles: { [baseA]: 'base', [baseB]: 'base', [roofA]: 'roof', [roofB]: 'roof' },
                  eliminations: elims,
                  regions: [{ type: 'row', index: A.r }, { type: 'row', index: B.r }, { type: 'col', index: CELL_COL[baseA] }],
                  links: [
                    { fromCell: roofA, fromDigit: d, toCell: baseA, toDigit: d, type: 'strong' },
                    { fromCell: baseA, fromDigit: d, toCell: baseB, toDigit: d, type: 'weak' },
                    { fromCell: baseB, fromDigit: d, toCell: roofB, toDigit: d, type: 'strong' }
                  ],
                  summary: `Skyscraper sobre el candidato ${d}: enlaces fuertes en las Filas ${A.r+1} (${cellName(baseA)}—${cellName(roofA)}) y ${B.r+1} (${cellName(baseB)}—${cellName(roofB)}) comparten la Columna base ${CELL_COL[baseA]+1}. Al menos una de las cimas (${cellName(roofA)} o ${cellName(roofB)}) contiene ${d}.`
                };
              }
            }
          }
        }
      }
    }
    // Col-based Skyscraper
    const colPairs = [];
    for (let c = 0; c < 9; c++) {
      const cells = COLS[c].filter(idx => grid[idx] === 0 && (cands[idx] & bit));
      if (cells.length === 2) colPairs.push({ c, cells });
    }
    for (let i = 0; i < colPairs.length; i++) {
      for (let j = i + 1; j < colPairs.length; j++) {
        const A = colPairs[i], B = colPairs[j];
        for (const [idxABase, idxARoof] of [[0,1], [1,0]]) {
          for (const [idxBBase, idxBRoof] of [[0,1], [1,0]]) {
            const baseA = A.cells[idxABase], roofA = A.cells[idxARoof];
            const baseB = B.cells[idxBBase], roofB = B.cells[idxBRoof];
            if (CELL_ROW[baseA] === CELL_ROW[baseB] && CELL_ROW[roofA] !== CELL_ROW[roofB]) {
              const pCells = [baseA, roofA, baseB, roofB];
              const elims = [];
              for (let t = 0; t < 81; t++) {
                if (!pCells.includes(t) && grid[t] === 0 && (cands[t] & bit) && sees(t, roofA) && sees(t, roofB)) {
                  elims.push({ cell: t, digit: d });
                }
              }
              if (elims.length > 0) {
                return {
                  techniqueId: 'skyscraper',
                  digit: d,
                  patternCells: pCells,
                  roles: { [baseA]: 'base', [baseB]: 'base', [roofA]: 'roof', [roofB]: 'roof' },
                  eliminations: elims,
                  regions: [{ type: 'col', index: A.c }, { type: 'col', index: B.c }, { type: 'row', index: CELL_ROW[baseA] }],
                  links: [
                    { fromCell: roofA, fromDigit: d, toCell: baseA, toDigit: d, type: 'strong' },
                    { fromCell: baseA, fromDigit: d, toCell: baseB, toDigit: d, type: 'weak' },
                    { fromCell: baseB, fromDigit: d, toCell: roofB, toDigit: d, type: 'strong' }
                  ],
                  summary: `Skyscraper sobre el candidato ${d}: enlaces fuertes en las Columnas ${A.c+1} y ${B.c+1} comparten la Fila base ${CELL_ROW[baseA]+1}. Al menos una cima (${cellName(roofA)} o ${cellName(roofB)}) contiene ${d}.`
                };
              }
            }
          }
        }
      }
    }
  }
  return null;
}

// 15. Two-String Kite
function detectTwoStringKite(grid, cands) {
  for (let d = 1; d <= 9; d++) {
    const bit = 1 << d;
    const rowPairs = [];
    for (let r = 0; r < 9; r++) {
      const cells = ROWS[r].filter(c => grid[c] === 0 && (cands[c] & bit));
      if (cells.length === 2) rowPairs.push({ r, cells });
    }
    const colPairs = [];
    for (let c = 0; c < 9; c++) {
      const cells = COLS[c].filter(idx => grid[idx] === 0 && (cands[idx] & bit));
      if (cells.length === 2) colPairs.push({ c, cells });
    }
    for (const rp of rowPairs) {
      for (const cp of colPairs) {
        for (const [rInBoxIdx, rEndIdx] of [[0,1], [1,0]]) {
          for (const [cInBoxIdx, cEndIdx] of [[0,1], [1,0]]) {
            const rBoxCell = rp.cells[rInBoxIdx], rEnd = rp.cells[rEndIdx];
            const cBoxCell = cp.cells[cInBoxIdx], cEnd = cp.cells[cEndIdx];
            if (rBoxCell === cBoxCell || rEnd === cEnd || rBoxCell === cEnd || cBoxCell === rEnd) continue;
            if (CELL_BOX[rBoxCell] === CELL_BOX[cBoxCell] && CELL_BOX[rEnd] !== CELL_BOX[rBoxCell] && CELL_BOX[cEnd] !== CELL_BOX[cBoxCell]) {
              const pCells = [rEnd, rBoxCell, cBoxCell, cEnd];
              const elims = [];
              for (let t = 0; t < 81; t++) {
                if (!pCells.includes(t) && grid[t] === 0 && (cands[t] & bit) && sees(t, rEnd) && sees(t, cEnd)) {
                  elims.push({ cell: t, digit: d });
                }
              }
              if (elims.length > 0) {
                return {
                  techniqueId: 'two_string_kite',
                  digit: d,
                  patternCells: pCells,
                  roles: { [rBoxCell]: 'base', [cBoxCell]: 'base', [rEnd]: 'pincer', [cEnd]: 'pincer' },
                  eliminations: elims,
                  regions: [{ type: 'row', index: rp.r }, { type: 'col', index: cp.c }, { type: 'box', index: CELL_BOX[rBoxCell] }],
                  links: [
                    { fromCell: rEnd, fromDigit: d, toCell: rBoxCell, toDigit: d, type: 'strong' },
                    { fromCell: rBoxCell, fromDigit: d, toCell: cBoxCell, toDigit: d, type: 'weak' },
                    { fromCell: cBoxCell, fromDigit: d, toCell: cEnd, toDigit: d, type: 'strong' }
                  ],
                  summary: `Two-String Kite sobre ${d}: la Fila ${rp.r+1} (${cellName(rBoxCell)}—${cellName(rEnd)}) y la Columna ${cp.c+1} (${cellName(cBoxCell)}—${cellName(cEnd)}) se conectan dentro de la Región ${CELL_BOX[rBoxCell]+1}. Los extremos ${cellName(rEnd)} y ${cellName(cEnd)} eliminan ${d} en su intersección.`
                };
              }
            }
          }
        }
      }
    }
  }
  return null;
}

// 16. Empty Rectangle
function detectEmptyRectangle(grid, cands) {
  for (let d = 1; d <= 9; d++) {
    const bit = 1 << d;
    for (let b = 0; b < 9; b++) {
      const boxCells = BOXES[b].filter(c => grid[c] === 0 && (cands[c] & bit));
      if (boxCells.length < 2) continue;
      const boxRows = new Set(boxCells.map(c => CELL_ROW[c]));
      const boxCols = new Set(boxCells.map(c => CELL_COL[c]));
      if (boxRows.size === 1 || boxCols.size === 1) continue; // Pointing, not ER
      const brStart = Math.floor(b / 3) * 3, bcStart = (b % 3) * 3;
      for (let erR = brStart; erR < brStart + 3; erR++) {
        for (let erC = bcStart; erC < bcStart + 3; erC++) {
          // Check if all boxCells lie in erR or erC, with at least one in erR (outside erC) and at least one in erC (outside erR)
          const allInCross = boxCells.every(c => CELL_ROW[c] === erR || CELL_COL[c] === erC);
          const hasInRow = boxCells.some(c => CELL_ROW[c] === erR && CELL_COL[c] !== erC);
          const hasInCol = boxCells.some(c => CELL_COL[c] === erC && CELL_ROW[c] !== erR);
          if (!allInCross || !hasInRow || !hasInCol) continue;

          // Case 1: Conjugate pair in a column c2 (outside box b) with one end in erR
          for (let c2 = 0; c2 < 9; c2++) {
            if (c2 >= bcStart && c2 < bcStart + 3) continue;
            const colCands = COLS[c2].filter(idx => grid[idx] === 0 && (cands[idx] & bit));
            if (colCands.length !== 2) continue;
            const linkCell = erR * 9 + c2;
            if (!colCands.includes(linkCell)) continue;
            const otherEnd = colCands[0] === linkCell ? colCands[1] : colCands[0];
            const targetRow = CELL_ROW[otherEnd];
            if (targetRow >= brStart && targetRow < brStart + 3) continue;
            const targetCell = targetRow * 9 + erC;
            if (grid[targetCell] === 0 && (cands[targetCell] & bit)) {
              return {
                techniqueId: 'empty_rectangle',
                digit: d,
                patternCells: [...boxCells, linkCell, otherEnd],
                roles: { [linkCell]: 'bridge', [otherEnd]: 'pincer' },
                eliminations: [{ cell: targetCell, digit: d }],
                regions: [{ type: 'box', index: b }, { type: 'col', index: c2 }],
                links: [
                  { fromCell: boxCells[0], fromDigit: d, toCell: linkCell, toDigit: d, type: 'weak' },
                  { fromCell: linkCell, fromDigit: d, toCell: otherEnd, toDigit: d, type: 'strong' }
                ],
                summary: `Empty Rectangle sobre ${d} en la Región ${b+1} (alineado en Fila ${erR+1} y Columna ${erC+1}) combinado con el enlace fuerte en la Columna ${c2+1} (${cellName(linkCell)}—${cellName(otherEnd)}). Elimina ${d} en ${cellName(targetCell)}.`
              };
            }
          }
          // Case 2: Conjugate pair in a row r2 (outside box b) with one end in erC
          for (let r2 = 0; r2 < 9; r2++) {
            if (r2 >= brStart && r2 < brStart + 3) continue;
            const rowCands = ROWS[r2].filter(idx => grid[idx] === 0 && (cands[idx] & bit));
            if (rowCands.length !== 2) continue;
            const linkCell = r2 * 9 + erC;
            if (!rowCands.includes(linkCell)) continue;
            const otherEnd = rowCands[0] === linkCell ? rowCands[1] : rowCands[0];
            const targetCol = CELL_COL[otherEnd];
            if (targetCol >= bcStart && targetCol < bcStart + 3) continue;
            const targetCell = erR * 9 + targetCol;
            if (grid[targetCell] === 0 && (cands[targetCell] & bit)) {
              return {
                techniqueId: 'empty_rectangle',
                digit: d,
                patternCells: [...boxCells, linkCell, otherEnd],
                roles: { [linkCell]: 'bridge', [otherEnd]: 'pincer' },
                eliminations: [{ cell: targetCell, digit: d }],
                regions: [{ type: 'box', index: b }, { type: 'row', index: r2 }],
                links: [
                  { fromCell: boxCells[0], fromDigit: d, toCell: linkCell, toDigit: d, type: 'weak' },
                  { fromCell: linkCell, fromDigit: d, toCell: otherEnd, toDigit: d, type: 'strong' }
                ],
                summary: `Empty Rectangle sobre ${d} en la Región ${b+1} (alineado en Fila ${erR+1} y Columna ${erC+1}) combinado con el enlace fuerte en la Fila ${r2+1} (${cellName(linkCell)}—${cellName(otherEnd)}). Elimina ${d} en ${cellName(targetCell)}.`
              };
            }
          }
        }
      }
    }
  }
  return null;
}

// 12. Simple Coloring
function detectSimpleColoring(grid, cands) {
  for (let d = 1; d <= 9; d++) {
    const bit = 1 << d;
    const pairs = getConjugatePairs(grid, cands, d);
    if (pairs.length < 2) continue;
    const adj = new Map();
    for (const { u, v } of pairs) {
      if (!adj.has(u)) adj.set(u, []);
      if (!adj.has(v)) adj.set(v, []);
      if (!adj.get(u).includes(v)) adj.get(u).push(v);
      if (!adj.get(v).includes(u)) adj.get(v).push(u);
    }
    const visited = new Map();
    for (const startNode of adj.keys()) {
      if (visited.has(startNode)) continue;
      const comp = [];
      const queue = [[startNode, 0]];
      visited.set(startNode, 0);
      const links = [];
      while (queue.length > 0) {
        const [curr, col] = queue.shift();
        comp.push({ cell: curr, color: col });
        for (const nxt of adj.get(curr)) {
          if (curr < nxt) links.push({ fromCell: curr, fromDigit: d, toCell: nxt, toDigit: d, type: 'strong' });
          if (!visited.has(nxt)) {
            visited.set(nxt, 1 - col);
            queue.push([nxt, 1 - col]);
          }
        }
      }
      if (comp.length < 5) continue;
      const color0 = comp.filter(x => x.color === 0).map(x => x.cell);
      const color1 = comp.filter(x => x.color === 1).map(x => x.cell);
      const compCells = comp.map(x => x.cell);
      const roles = {};
      for (const c of color0) roles[c] = 'colorA';
      for (const c of color1) roles[c] = 'colorB';

      // Rule 4: Color Wrap (two same-color nodes see each other)
      for (const [sameGroup, label] of [[color0, 'Color A'], [color1, 'Color B']]) {
        let wrapConflict = false;
        for (let i = 0; i < sameGroup.length; i++) {
          for (let j = i + 1; j < sameGroup.length; j++) {
            if (sees(sameGroup[i], sameGroup[j])) wrapConflict = true;
          }
        }
        if (wrapConflict) {
          const elims = sameGroup.map(cell => ({ cell, digit: d }));
          return {
            techniqueId: 'simple_coloring',
            subType: 'Color Wrap',
            digit: d,
            patternCells: compCells,
            roles,
            eliminations: elims,
            regions: [],
            links,
            summary: `Simple Coloring (Color Wrap) sobre el dígito ${d}: dos celdas del mismo color (${label}) se ven mutuamente, lo que hace imposible ese color y elimina ${d} de todas las celdas ${label}.`
          };
        }
      }

      // Rule 2: Color Trap (uncolored cell sees both colors)
      const elims = [];
      for (let t = 0; t < 81; t++) {
        if (!compCells.includes(t) && grid[t] === 0 && (cands[t] & bit)) {
          const sees0 = color0.some(c => sees(t, c));
          const sees1 = color1.some(c => sees(t, c));
          if (sees0 && sees1) elims.push({ cell: t, digit: d });
        }
      }
      if (elims.length > 0) {
        return {
          techniqueId: 'simple_coloring',
          subType: 'Color Trap',
          digit: d,
          patternCells: compCells,
          roles,
          eliminations: elims,
          regions: [],
          links,
          summary: `Simple Coloring (Color Trap) sobre el dígito ${d}: la cadena de pares conjugados divide los candidatos en dos paridades (Color A y Color B). Toda celda externa que vea ambos colores no puede contener ${d}.`
        };
      }
    }
  }
  return null;
}

// 13. Multi-Coloring (Type 1 Wrap & Type 2 Trap)
function detectMultiColoring(grid, cands) {
  for (let d = 1; d <= 9; d++) {
    const bit = 1 << d;
    const pairs = getConjugatePairs(grid, cands, d);
    if (pairs.length < 2) continue;
    const adj = new Map();
    for (const { u, v } of pairs) {
      if (!adj.has(u)) adj.set(u, []);
      if (!adj.has(v)) adj.set(v, []);
      if (!adj.get(u).includes(v)) adj.get(u).push(v);
      if (!adj.get(v).includes(u)) adj.get(v).push(u);
    }
    const visited = new Map();
    const clusters = [];
    for (const startNode of adj.keys()) {
      if (visited.has(startNode)) continue;
      const comp = [], links = [];
      const queue = [[startNode, 0]];
      visited.set(startNode, 0);
      while (queue.length > 0) {
        const [curr, col] = queue.shift();
        comp.push({ cell: curr, color: col });
        for (const nxt of adj.get(curr)) {
          if (curr < nxt) links.push({ fromCell: curr, fromDigit: d, toCell: nxt, toDigit: d, type: 'strong' });
          if (!visited.has(nxt)) {
            visited.set(nxt, 1 - col);
            queue.push([nxt, 1 - col]);
          }
        }
      }
      clusters.push({
        c0: comp.filter(x => x.color === 0).map(x => x.cell),
        c1: comp.filter(x => x.color === 1).map(x => x.cell),
        all: comp.map(x => x.cell),
        links
      });
    }
    if (clusters.length < 2) continue;
    for (let i = 0; i < clusters.length; i++) {
      for (let j = i + 1; j < clusters.length; j++) {
        const K1 = clusters[i], K2 = clusters[j];
        if (K1.all.length + K2.all.length < 6) continue;

        // Type 1 (Color Wrap across clusters): A color group in one cluster sees BOTH colors of the other cluster
        const wrapPairs = [
          { targetGrp: K1.c0, keepGrp: K1.c1, otherA: K2.c0, otherB: K2.c1 },
          { targetGrp: K1.c1, keepGrp: K1.c0, otherA: K2.c0, otherB: K2.c1 },
          { targetGrp: K2.c0, keepGrp: K2.c1, otherA: K1.c0, otherB: K1.c1 },
          { targetGrp: K2.c1, keepGrp: K2.c0, otherA: K1.c0, otherB: K1.c1 }
        ];
        for (const { targetGrp, keepGrp, otherA, otherB } of wrapPairs) {
          let linkA = null, linkB = null;
          for (const u of targetGrp) {
            for (const a of otherA) if (sees(u, a)) { linkA = [u, a]; break; }
            for (const b of otherB) if (sees(u, b)) { linkB = [u, b]; break; }
          }
          if (linkA && linkB) {
            const allPattern = [...K1.all, ...K2.all];
            const roles = {};
            for (const c of targetGrp) roles[c] = 'colorA';
            for (const c of keepGrp) roles[c] = 'colorB';
            for (const c of otherA) roles[c] = 'alsA';
            for (const c of otherB) roles[c] = 'alsB';
            return {
              techniqueId: 'multi_coloring',
              subType: 'Tipo 1 (Wrap)',
              digit: d,
              patternCells: allPattern,
              roles,
              eliminations: targetGrp.map(cell => ({ cell, digit: d })),
              regions: [],
              links: [
                ...K1.links,
                ...K2.links,
                { fromCell: linkA[0], fromDigit: d, toCell: linkA[1], toDigit: d, type: 'weak' },
                { fromCell: linkB[0], fromDigit: d, toCell: linkB[1], toDigit: d, type: 'weak' }
              ],
              summary: `Multi-Coloring (Tipo 1) sobre el candidato ${d}: una paridad del primer clúster ve simultáneamente a ambos colores del segundo clúster (${cellName(linkA[1])} y ${cellName(linkB[1])}), por lo que dicha paridad es imposible y se elimina ${d} de todas sus celdas.`
            };
          }
        }

        // Type 2 (Color Trap across clusters): Weak link between bridge1 and bridge2 forces opp1 OR opp2
        const combos = [
          { bridge1: K1.c0, opp1: K1.c1, bridge2: K2.c0, opp2: K2.c1 },
          { bridge1: K1.c0, opp1: K1.c1, bridge2: K2.c1, opp2: K2.c0 },
          { bridge1: K1.c1, opp1: K1.c0, bridge2: K2.c0, opp2: K2.c1 },
          { bridge1: K1.c1, opp1: K1.c0, bridge2: K2.c1, opp2: K2.c0 }
        ];
        for (const { bridge1, opp1, bridge2, opp2 } of combos) {
          let bCell1 = -1, bCell2 = -1;
          for (const u of bridge1) {
            for (const v of bridge2) {
              if (sees(u, v)) { bCell1 = u; bCell2 = v; break; }
            }
            if (bCell1 !== -1) break;
          }
          if (bCell1 === -1) continue;
          const allPattern = [...K1.all, ...K2.all];
          const elims = [];
          for (let t = 0; t < 81; t++) {
            if (!allPattern.includes(t) && grid[t] === 0 && (cands[t] & bit)) {
              if (opp1.some(u => sees(t, u)) && opp2.some(v => sees(t, v))) {
                elims.push({ cell: t, digit: d });
              }
            }
          }
          if (elims.length > 0) {
            const roles = {};
            for (const c of bridge1) roles[c] = 'colorA';
            for (const c of opp1) roles[c] = 'colorB';
            for (const c of bridge2) roles[c] = 'alsA';
            for (const c of opp2) roles[c] = 'alsB';
            return {
              techniqueId: 'multi_coloring',
              subType: 'Tipo 2 (Trap)',
              digit: d,
              patternCells: allPattern,
              roles,
              eliminations: elims,
              regions: [],
              links: [
                ...K1.links,
                ...K2.links,
                { fromCell: bCell1, fromDigit: d, toCell: bCell2, toDigit: d, type: 'weak' }
              ],
              summary: `Multi-Coloring (Tipo 2) sobre el candidato ${d}: dos clústeres independientes de coloreo se conectan débilmente entre ${cellName(bCell1)} y ${cellName(bCell2)}. Al menos una de las paridades opuestas es verdadera, eliminando ${d} de las celdas que ven a ambas.`
            };
          }
        }
      }
    }
  }
  return null;
}

// 17. Unique Rectangle (Types 1, 2, 4) — Strict shared-unit verification
function detectUniqueRectangle(grid, cands) {
  for (let r1 = 0; r1 < 9; r1++) {
    for (let r2 = r1 + 1; r2 < 9; r2++) {
      for (let c1 = 0; c1 < 9; c1++) {
        for (let c2 = c1 + 1; c2 < 9; c2++) {
          const corners = [r1*9+c1, r1*9+c2, r2*9+c1, r2*9+c2];
          if (corners.some(c => grid[c] !== 0)) continue;
          const boxes = new Set(corners.map(c => CELL_BOX[c]));
          if (boxes.size !== 2) continue;

          const biCorners = corners.filter(c => countBits(cands[c]) === 2);
          if (biCorners.length < 2) continue;
          const urMask = cands[biCorners[0]];
          if (biCorners.filter(c => cands[c] === urMask).length < 2) continue;
          if (!corners.every(c => (cands[c] & urMask) === urMask)) continue;
          const [x, y] = bitsToDigits(urMask);

          const nonBi = corners.filter(c => cands[c] !== urMask);
          // Type 1: 3 bivalue corners, 1 corner with extra candidates
          if (nonBi.length === 1) {
            const target = nonBi[0];
            if (countBits(cands[target] & ~urMask) < 1) continue;
            return {
              techniqueId: 'unique_rectangle',
              subType: 'Tipo 1',
              digits: [x, y],
              patternCells: corners,
              roles: { [target]: 'pivot' },
              eliminations: [
                { cell: target, digit: x },
                { cell: target, digit: y }
              ],
              regions: [],
              links: [
                { fromCell: corners[0], fromDigit: x, toCell: corners[1], toDigit: x, type: 'strong' },
                { fromCell: corners[2], fromDigit: x, toCell: corners[3], toDigit: x, type: 'strong' }
              ],
              summary: `Unique Rectangle (Tipo 1) en ${corners.map(cellName).join(', ')} con candidatos base {${x},${y}}. Para evitar un patrón mortal de dos soluciones, ${cellName(target)} no puede contener ${x} ni ${y}.`
            };
          }

          // Type 2 & Type 4: 2 corners with extra candidates MUST share a row or column (never diagonal!)
          if (nonBi.length === 2) {
            const [u, v] = nonBi;
            const shareRow = CELL_ROW[u] === CELL_ROW[v];
            const shareCol = CELL_COL[u] === CELL_COL[v];
            if (!shareRow && !shareCol) continue; // Strict requirement: roof cells must share a row or column!

            // Type 2: both u and v have the exact same 1 extra candidate Z
            if (cands[u] === cands[v] && countBits(cands[u]) === 3) {
              const zMask = cands[u] & ~urMask;
              const z = bitsToDigits(zMask)[0];
              const elims = [];
              for (let t = 0; t < 81; t++) {
                if (!corners.includes(t) && grid[t] === 0 && (cands[t] & zMask) && sees(t, u) && sees(t, v)) {
                  elims.push({ cell: t, digit: z });
                }
              }
              if (elims.length > 0) {
                const sharedRegions = [];
                if (shareRow) sharedRegions.push({ type: 'row', index: CELL_ROW[u] });
                if (shareCol) sharedRegions.push({ type: 'col', index: CELL_COL[u] });
                if (CELL_BOX[u] === CELL_BOX[v]) sharedRegions.push({ type: 'box', index: CELL_BOX[u] });
                return {
                  techniqueId: 'unique_rectangle',
                  subType: 'Tipo 2',
                  digit: z,
                  digits: [x, y, z],
                  patternCells: corners,
                  roles: { [u]: 'pincer', [v]: 'pincer' },
                  eliminations: elims,
                  regions: sharedRegions,
                  links: [{ fromCell: u, fromDigit: z, toCell: v, toDigit: z, type: 'strong' }],
                  summary: `Unique Rectangle (Tipo 2) en ${corners.map(cellName).join(', ')}: las esquinas alineadas ${cellName(u)} y ${cellName(v)} comparten un único candidato extra (${z}). Al menos una debe contener ${z}, eliminando ${z} de las celdas que ven a ambas.`
                };
              }
            }

            // Type 4: u and v share a unit where X (or Y) is strongly linked (only appears in u and v)
            for (const unit of UNITS) {
              if (unit.cells.includes(u) && unit.cells.includes(v)) {
                for (const [strongD, elimD] of [[x, y], [y, x]]) {
                  const sBit = 1 << strongD;
                  const cellsWithS = unit.cells.filter(c => grid[c] === 0 && (cands[c] & sBit));
                  if (cellsWithS.length === 2 && cellsWithS.includes(u) && cellsWithS.includes(v)) {
                    return {
                      techniqueId: 'unique_rectangle',
                      subType: 'Tipo 4',
                      digit: elimD,
                      digits: [x, y],
                      patternCells: corners,
                      roles: { [u]: 'pincer', [v]: 'pincer' },
                      eliminations: [{ cell: u, digit: elimD }, { cell: v, digit: elimD }],
                      regions: [{ type: unit.type, index: unit.index }],
                      links: [{ fromCell: u, fromDigit: strongD, toCell: v, toDigit: strongD, type: 'strong' }],
                      summary: `Unique Rectangle (Tipo 4) en ${corners.map(cellName).join(', ')}: el enlace fuerte de ${strongD} en ${unit.name} obliga a que ${strongD} ocupe ${cellName(u)} o ${cellName(v)}, eliminando ${elimD} de ambas.`
                    };
                  }
                }
              }
            }
          }
        }
      }
    }
  }
  return null;
}

// Helper: find all Almost Locked Sets (ALS) of size 1..maxSize in all units
function findAllALS(grid, cands, maxSize = 2) {
  const alsList = [];
  const seenKey = new Set();
  for (const unit of UNITS) {
    const emptyCells = unit.cells.filter(c => grid[c] === 0 && countBits(cands[c]) >= 2);
    for (let sz = 1; sz <= Math.min(maxSize, emptyCells.length); sz++) {
      for (const subset of combinations(emptyCells, sz)) {
        let mask = 0;
        for (const c of subset) mask |= cands[c];
        if (countBits(mask) === sz + 1) {
          const key = subset.slice().sort((a,b)=>a-b).join(',');
          if (!seenKey.has(key)) {
            seenKey.add(key);
            alsList.push({ cells: subset, mask, unit });
          }
        }
      }
    }
  }
  return alsList;
}

// 18. ALS-XZ (Strict RCC & multi-sector verification)
function detectALSXZ(grid, cands) {
  const alsList = findAllALS(grid, cands, 2);
  for (let i = 0; i < alsList.length; i++) {
    for (let j = i + 1; j < alsList.length; j++) {
      const A = alsList[i], B = alsList[j];
      if (A.cells.some(c => B.cells.includes(c))) continue;
      if (A.cells.length === 1 && B.cells.length === 1) continue; // 1+1 is XY-Wing or Naked Pair
      const pCells = [...A.cells, ...B.cells];
      // Prevent degenerating into a single-unit Naked Subset (Naked Pair/Triple/Quad)
      if (UNITS.some(u => pCells.every(c => u.cells.includes(c)))) continue;

      const commonMask = A.mask & B.mask;
      if (countBits(commonMask) < 2) continue;
      const commonDigits = bitsToDigits(commonMask);

      for (const x of commonDigits) {
        const xBit = 1 << x;
        const xCellsA = A.cells.filter(c => (cands[c] & xBit) !== 0);
        const xCellsB = B.cells.filter(c => (cands[c] & xBit) !== 0);
        if (xCellsA.length === 0 || xCellsB.length === 0) continue;
        let allSee = true;
        for (const ca of xCellsA) {
          for (const cb of xCellsB) {
            if (!sees(ca, cb)) { allSee = false; break; }
          }
          if (!allSee) break;
        }
        if (!allSee) continue;

        for (const z of commonDigits) {
          if (z === x) continue;
          const zBit = 1 << z;
          const zCellsA = A.cells.filter(c => (cands[c] & zBit) !== 0);
          const zCellsB = B.cells.filter(c => (cands[c] & zBit) !== 0);
          if (zCellsA.length === 0 || zCellsB.length === 0) continue;
          const zCells = [...zCellsA, ...zCellsB];
          const elims = [];
          for (let t = 0; t < 81; t++) {
            if (!pCells.includes(t) && grid[t] === 0 && (cands[t] & zBit)) {
              if (zCells.every(zc => sees(t, zc))) {
                elims.push({ cell: t, digit: z });
              }
            }
          }
          if (elims.length > 0) {
            const roles = {};
            for (const c of A.cells) roles[c] = 'alsA';
            for (const c of B.cells) roles[c] = 'alsB';
            return {
              techniqueId: 'als_xz',
              digit: z,
              digits: [x, z],
              patternCells: pCells,
              roles,
              eliminations: elims,
              regions: [],
              links: [
                { fromCell: xCellsA[0], fromDigit: x, toCell: xCellsB[0], toDigit: x, type: 'weak' },
                { fromCell: xCellsA[0], fromDigit: x, toCell: zCellsA[0], toDigit: z, type: 'strong' },
                { fromCell: xCellsB[0], fromDigit: x, toCell: zCellsB[0], toDigit: z, type: 'strong' }
              ],
              summary: `ALS-XZ: el conjunto ALS A (${A.cells.map(cellName).join(', ')} con {${bitsToDigits(A.mask).join(',')}}) y el ALS B (${B.cells.map(cellName).join(', ')} con {${bitsToDigits(B.mask).join(',')}}) comparten el candidato común restringido X=${x} y el candidato objetivo Z=${z}. Se elimina ${z} de toda celda que vea a todos los ${z} de ambos ALS.`
            };
          }
        }
      }
    }
  }
  return null;
}

// 19. AIC (Alternating Inference Chains — Type 1 & Type 2, multi-digit validated)
function detectAIC(grid, cands) {
  const nodes = [];
  const nodeIndex = new Map();
  for (let c = 0; c < 81; c++) {
    if (grid[c] !== 0) continue;
    for (const d of bitsToDigits(cands[c])) {
      const id = c * 10 + d;
      nodeIndex.set(id, nodes.length);
      nodes.push({ id, cell: c, digit: d, strong: [], weak: [] });
    }
  }
  for (let c = 0; c < 81; c++) {
    if (grid[c] !== 0) continue;
    const ds = bitsToDigits(cands[c]);
    const isBi = ds.length === 2;
    for (let i = 0; i < ds.length; i++) {
      for (let j = i + 1; j < ds.length; j++) {
        const u = nodeIndex.get(c * 10 + ds[i]);
        const v = nodeIndex.get(c * 10 + ds[j]);
        if (isBi) {
          nodes[u].strong.push(v);
          nodes[v].strong.push(u);
        }
        nodes[u].weak.push(v);
        nodes[v].weak.push(u);
      }
    }
  }
  for (const unit of UNITS) {
    for (let d = 1; d <= 9; d++) {
      const bit = 1 << d;
      const uCells = unit.cells.filter(c => grid[c] === 0 && (cands[c] & bit));
      const isConj = uCells.length === 2;
      for (let i = 0; i < uCells.length; i++) {
        for (let j = i + 1; j < uCells.length; j++) {
          const u = nodeIndex.get(uCells[i] * 10 + d);
          const v = nodeIndex.get(uCells[j] * 10 + d);
          if (isConj) {
            if (!nodes[u].strong.includes(v)) nodes[u].strong.push(v);
            if (!nodes[v].strong.includes(u)) nodes[v].strong.push(u);
          }
          if (!nodes[u].weak.includes(v)) nodes[u].weak.push(v);
          if (!nodes[v].weak.includes(u)) nodes[v].weak.push(u);
        }
      }
    }
  }

  for (let sIdx = 0; sIdx < nodes.length; sIdx++) {
    const n0 = nodes[sIdx];
    for (const n1Idx of n0.strong) {
      const n1 = nodes[n1Idx];
      for (const n2Idx of n1.weak) {
        if (n2Idx === sIdx) continue;
        const n2 = nodes[n2Idx];
        for (const n3Idx of n2.strong) {
          if (n3Idx === sIdx || n3Idx === n1Idx) continue;
          const n3 = nodes[n3Idx];
          const res4 = evaluateAICChain(grid, cands, [n0, n1, n2, n3]);
          if (res4) return res4;
          for (const n4Idx of n3.weak) {
            if ([sIdx, n1Idx, n2Idx, n3Idx].includes(n4Idx)) continue;
            const n4 = nodes[n4Idx];
            for (const n5Idx of n4.strong) {
              if ([sIdx, n1Idx, n2Idx, n3Idx, n4Idx].includes(n5Idx)) continue;
              const n5 = nodes[n5Idx];
              const res6 = evaluateAICChain(grid, cands, [n0, n1, n2, n3, n4, n5]);
              if (res6) return res6;
            }
          }
        }
      }
    }
  }
  return null;
}

function evaluateAICChain(grid, cands, chain) {
  const first = chain[0], last = chain[chain.length - 1];
  const cellSet = [...new Set(chain.map(n => n.cell))];
  if (cellSet.length < 3) return null;
  const digitSet = [...new Set(chain.map(n => n.digit))];
  // Require at least 2 distinct digits so single-digit Turbot Fish are not misclassified as AIC
  if (digitSet.length < 2) return null;
  // Exclude pure 3-cell bivalue XY-Wing (3 cells, 3 digits, all bivalue)
  if (cellSet.length === 3 && digitSet.length === 3 && cellSet.every(c => countBits(cands[c]) === 2)) return null;

  const chainNodeIds = new Set(chain.map(n => n.id));
  const elims = [];
  if (first.digit === last.digit && first.cell !== last.cell) {
    const d = first.digit, bit = 1 << d;
    for (let t = 0; t < 81; t++) {
      if (!cellSet.includes(t) && grid[t] === 0 && (cands[t] & bit) && sees(t, first.cell) && sees(t, last.cell)) {
        elims.push({ cell: t, digit: d });
      }
    }
  } else if (first.digit !== last.digit && first.cell !== last.cell && sees(first.cell, last.cell)) {
    if ((cands[first.cell] & (1 << last.digit)) && !chainNodeIds.has(first.cell * 10 + last.digit)) {
      elims.push({ cell: first.cell, digit: last.digit });
    }
    if ((cands[last.cell] & (1 << first.digit)) && !chainNodeIds.has(last.cell * 10 + first.digit)) {
      elims.push({ cell: last.cell, digit: first.digit });
    }
  }
  if (elims.length === 0) return null;
  const links = [];
  for (let i = 0; i < chain.length - 1; i++) {
    links.push({
      fromCell: chain[i].cell,
      fromDigit: chain[i].digit,
      toCell: chain[i+1].cell,
      toDigit: chain[i+1].digit,
      type: i % 2 === 0 ? 'strong' : 'weak'
    });
  }
  const roles = { [first.cell]: 'pincer', [last.cell]: 'pincer' };
  const chainStr = chain.map((n, idx) => `${cellName(n.cell)}(${n.digit})${idx < chain.length - 1 ? (idx % 2 === 0 ? ' = ' : ' - ') : ''}`).join('');
  return {
    techniqueId: 'aic',
    digit: elims[0].digit,
    digits: digitSet,
    patternCells: cellSet,
    roles,
    eliminations: elims,
    regions: [],
    links,
    summary: `Cadena de Inferencia Alternante (AIC): ${chainStr}. Como los extremos están unidos por inferencias alternantes que inician y terminan en enlace fuerte, al menos uno de los extremos es verdadero.`
  };
}

// 20. Forcing Chains (3-Branch Cell Forcing Chains)
function detectForcingChains(grid, cands) {
  for (let s = 0; s < 81; s++) {
    if (grid[s] !== 0) continue;
    const ds = bitsToDigits(cands[s]);
    if (ds.length !== 3) continue;
    const branchResults = [];
    for (const d of ds) {
      branchResults.push(propagateAssumption(grid, cands, s, d, 4));
    }
    for (let t = 0; t < 81; t++) {
      if (t === s || grid[t] !== 0) continue;
      for (const elimD of bitsToDigits(cands[t])) {
        if (branchResults.every(br => br.eliminated.has(t * 10 + elimD) && (br.steps.get(t * 10 + elimD) || 0) >= 1)) {
          if (!branchResults.some(br => (br.steps.get(t * 10 + elimD) || 0) >= 2)) continue;
          const links = [];
          const pSet = new Set([s, t]);
          for (const br of branchResults) {
            const path = br.paths.get(t * 10 + elimD) || [];
            for (const step of path) {
              pSet.add(step.fromCell);
              pSet.add(step.toCell);
              links.push(step);
            }
          }
          return {
            techniqueId: 'forcing_chains',
            digit: elimD,
            digits: ds,
            patternCells: [...pSet],
            roles: { [s]: 'pivot', [t]: 'pincer' },
            eliminations: [{ cell: t, digit: elimD }],
            regions: [],
            links: links.slice(0, 8),
            summary: `Forcing Chain de 3 ramas desde ${cellName(s)} {${ds.join(',')}}: bajo cualquiera de los tres candidatos posibles de ${cellName(s)}, las cadenas de implicación convergen forzando que ${cellName(t)} no pueda contener ${elimD}.`
          };
        }
      }
    }
  }
  return null;
}

function propagateAssumption(grid, cands, startCell, startDigit, maxDepth) {
  const eliminated = new Set();
  const steps = new Map();
  const paths = new Map();
  const trueQueue = [{ cell: startCell, digit: startDigit, depth: 0, path: [] }];
  const assigned = new Map([[startCell, startDigit]]);
  const localCands = new Int32Array(cands);
  localCands[startCell] = 1 << startDigit;

  while (trueQueue.length > 0) {
    const curr = trueQueue.shift();
    if (curr.depth >= maxDepth) continue;
    const bit = 1 << curr.digit;
    for (const p of PEERS[curr.cell]) {
      if (grid[p] !== 0) continue;
      if (localCands[p] & bit) {
        localCands[p] &= ~bit;
        const key = p * 10 + curr.digit;
        const linkStep = { fromCell: curr.cell, fromDigit: curr.digit, toCell: p, toDigit: curr.digit, type: 'weak' };
        const newPath = [...curr.path, linkStep];
        if (!eliminated.has(key)) {
          eliminated.add(key);
          steps.set(key, curr.depth + 1);
          paths.set(key, newPath);
        }
        if (countBits(localCands[p]) === 1 && !assigned.has(p)) {
          const nextD = bitsToDigits(localCands[p])[0];
          assigned.set(p, nextD);
          trueQueue.push({
            cell: p,
            digit: nextD,
            depth: curr.depth + 1,
            path: [...newPath, { fromCell: p, fromDigit: curr.digit, toCell: p, toDigit: nextD, type: 'strong' }]
          });
        }
      }
    }
  }
  return { eliminated, steps, paths };
}

// 21. Sue de Coq (Two-Sector Disjoint Subsets)
function detectSueDeCoq(grid, cands) {
  for (let b = 0; b < 9; b++) {
    const boxCells = BOXES[b];
    for (const lineType of ['row', 'col']) {
      const lines = lineType === 'row' ? ROWS : COLS;
      for (let l = 0; l < 9; l++) {
        const lineCells = lines[l];
        const inter = boxCells.filter(c => lineCells.includes(c) && grid[c] === 0);
        if (inter.length < 2 || inter.length > 3) continue;
        for (let iSize = 2; iSize <= inter.length; iSize++) {
          for (const I of combinations(inter, iSize)) {
            let iMask = 0;
            for (const c of I) iMask |= cands[c];
            const iDigitsCount = countBits(iMask);
            if (iDigitsCount < iSize + 2) continue;
            const remLine = lineCells.filter(c => !boxCells.includes(c) && grid[c] === 0);
            const remBox = boxCells.filter(c => !lineCells.includes(c) && grid[c] === 0);
            for (let lSize = 1; lSize <= Math.min(2, remLine.length); lSize++) {
              for (const AL of combinations(remLine, lSize)) {
                let alMask = 0;
                for (const c of AL) alMask |= cands[c];
                if ((alMask & iMask) === 0) continue;
                for (let bSize = 1; bSize <= Math.min(2, remBox.length); bSize++) {
                  for (const AB of combinations(remBox, bSize)) {
                    let abMask = 0;
                    for (const c of AB) abMask |= cands[c];
                    if ((abMask & iMask) === 0) continue;
                    if ((alMask & abMask) !== 0) continue;
                    const unionMask = iMask | alMask | abMask;
                    const totalCells = I.length + AL.length + AB.length;
                    if (countBits(unionMask) !== totalCells) continue;
                    const lineLockMask = alMask | (iMask & ~abMask);
                    const boxLockMask = abMask | (iMask & ~alMask);
                    const elims = [];
                    for (const c of remLine) {
                      if (!AL.includes(c)) {
                        for (const d of bitsToDigits(cands[c] & lineLockMask)) elims.push({ cell: c, digit: d });
                      }
                    }
                    for (const c of remBox) {
                      if (!AB.includes(c)) {
                        for (const d of bitsToDigits(cands[c] & boxLockMask)) elims.push({ cell: c, digit: d });
                      }
                    }
                    if (elims.length > 0) {
                      const roles = {};
                      for (const c of I) roles[c] = 'pivot';
                      for (const c of AL) roles[c] = 'alsA';
                      for (const c of AB) roles[c] = 'alsB';
                      return {
                        techniqueId: 'sue_de_coq',
                        digits: bitsToDigits(unionMask),
                        patternCells: [...I, ...AL, ...AB],
                        roles,
                        eliminations: elims,
                        regions: [{ type: 'box', index: b }, { type: lineType, index: l }],
                        links: [],
                        summary: `Sue de Coq en la intersección de la Región ${b+1} y la ${lineType === 'row' ? 'Fila' : 'Columna'} ${l+1} (${I.map(cellName).join(', ')}), complementada por ${AL.map(cellName).join(', ')} en la línea y ${AB.map(cellName).join(', ')} en la región.`
                      };
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
  return null;
}

// 22. Death Blossom (Supports both 2-candidate and 3-candidate stems; excludes 1+1 XY-Wing)
function detectDeathBlossom(grid, cands) {
  const alsList = findAllALS(grid, cands, 2);
  for (let stem = 0; stem < 81; stem++) {
    if (grid[stem] !== 0) continue;
    const stemDigits = bitsToDigits(cands[stem]);
    if (stemDigits.length !== 2 && stemDigits.length !== 3) continue;
    const petalsByDigit = [];
    let possible = true;
    for (const d of stemDigits) {
      const bit = 1 << d;
      const validALS = alsList.filter(als => {
        if (als.cells.includes(stem)) return false;
        if ((als.mask & bit) === 0) return false;
        const dCells = als.cells.filter(c => (cands[c] & bit) !== 0);
        return dCells.length > 0 && dCells.every(c => sees(stem, c));
      });
      if (validALS.length === 0) { possible = false; break; }
      petalsByDigit.push(validALS);
    }
    if (!possible) continue;

    if (stemDigits.length === 2) {
      for (const p1 of petalsByDigit[0]) {
        for (const p2 of petalsByDigit[1]) {
          if (p1.cells.some(c => p2.cells.includes(c))) continue;
          // Exclude 1-cell + 1-cell bivalue petals (that is an XY-Wing!)
          if (p1.cells.length === 1 && p2.cells.length === 1) continue;
          const commonZMask = p1.mask & p2.mask & ~cands[stem];
          if (commonZMask === 0) continue;
          for (const z of bitsToDigits(commonZMask)) {
            const zBit = 1 << z;
            const zCells1 = p1.cells.filter(c => (cands[c] & zBit) !== 0);
            const zCells2 = p2.cells.filter(c => (cands[c] & zBit) !== 0);
            if (zCells1.length === 0 || zCells2.length === 0) continue;
            const zCells = [...zCells1, ...zCells2];
            const patternCells = [stem, ...p1.cells, ...p2.cells];
            const elims = [];
            for (let t = 0; t < 81; t++) {
              if (!patternCells.includes(t) && grid[t] === 0 && (cands[t] & zBit)) {
                if (zCells.every(zc => sees(t, zc))) elims.push({ cell: t, digit: z });
              }
            }
            if (elims.length > 0) {
              const roles = { [stem]: 'pivot' };
              for (const c of p1.cells) roles[c] = 'alsA';
              for (const c of p2.cells) roles[c] = 'alsB';
              const rcc1Cell = p1.cells.find(c => (cands[c] & (1 << stemDigits[0])) !== 0);
              const rcc2Cell = p2.cells.find(c => (cands[c] & (1 << stemDigits[1])) !== 0);
              return {
                techniqueId: 'death_blossom',
                digit: z,
                digits: [...stemDigits, z],
                patternCells,
                roles,
                eliminations: elims,
                regions: [],
                links: [
                  { fromCell: stem, fromDigit: stemDigits[0], toCell: rcc1Cell, toDigit: stemDigits[0], type: 'weak' },
                  { fromCell: stem, fromDigit: stemDigits[1], toCell: rcc2Cell, toDigit: stemDigits[1], type: 'weak' },
                  { fromCell: rcc1Cell, fromDigit: stemDigits[0], toCell: zCells1[0], toDigit: z, type: 'strong' },
                  { fromCell: rcc2Cell, fromDigit: stemDigits[1], toCell: zCells2[0], toDigit: z, type: 'strong' }
                ],
                summary: `Death Blossom con celda tallo (Stem) en ${cellName(stem)} {${stemDigits.join(',')}}, conectada al Pétalo ALS 1 (${p1.cells.map(cellName).join(', ')}) y al Pétalo ALS 2 (${p2.cells.map(cellName).join(', ')}). Ambos pétalos comparten el candidato común Z=${z}, eliminándolo de las celdas que ven a todos los ${z} de los pétalos.`
              };
            }
          }
        }
      }
    } else if (stemDigits.length === 3) {
      for (const p1 of petalsByDigit[0]) {
        for (const p2 of petalsByDigit[1]) {
          if (p1.cells.some(c => p2.cells.includes(c))) continue;
          for (const p3 of petalsByDigit[2]) {
            if (p3.cells.some(c => p1.cells.includes(c) || p2.cells.includes(c))) continue;
            if (p1.cells.length === 1 && p2.cells.length === 1 && p3.cells.length === 1) continue;
            const commonZMask = p1.mask & p2.mask & p3.mask & ~cands[stem];
            if (commonZMask === 0) continue;
            for (const z of bitsToDigits(commonZMask)) {
              const zBit = 1 << z;
              const zCells = [
                ...p1.cells.filter(c => (cands[c] & zBit) !== 0),
                ...p2.cells.filter(c => (cands[c] & zBit) !== 0),
                ...p3.cells.filter(c => (cands[c] & zBit) !== 0)
              ];
              const patternCells = [stem, ...p1.cells, ...p2.cells, ...p3.cells];
              const elims = [];
              for (let t = 0; t < 81; t++) {
                if (!patternCells.includes(t) && grid[t] === 0 && (cands[t] & zBit)) {
                  if (zCells.every(zc => sees(t, zc))) elims.push({ cell: t, digit: z });
                }
              }
              if (elims.length > 0) {
                const roles = { [stem]: 'pivot' };
                for (const c of p1.cells) roles[c] = 'alsA';
                for (const c of p2.cells) roles[c] = 'alsB';
                for (const c of p3.cells) roles[c] = 'pincer';
                return {
                  techniqueId: 'death_blossom',
                  digit: z,
                  digits: [...stemDigits, z],
                  patternCells,
                  roles,
                  eliminations: elims,
                  regions: [],
                  links: [
                    { fromCell: stem, fromDigit: stemDigits[0], toCell: p1.cells[0], toDigit: stemDigits[0], type: 'weak' },
                    { fromCell: stem, fromDigit: stemDigits[1], toCell: p2.cells[0], toDigit: stemDigits[1], type: 'weak' },
                    { fromCell: stem, fromDigit: stemDigits[2], toCell: p3.cells[0], toDigit: stemDigits[2], type: 'weak' }
                  ],
                  summary: `Death Blossom de 3 pétalos con tallo en ${cellName(stem)} {${stemDigits.join(',')}}, conectado a tres conjuntos ALS que comparten Z=${z}.`
                };
              }
            }
          }
        }
      }
    }
  }
  return null;
}

// 23. Advanced Chains & Complex Patterns (Finned X-Wing / Finned Swordfish / Grouped Chains)
function detectAdvancedChains(grid, cands) {
  // Finned X-Wing (Row base -> Col cover & Col base -> Row cover)
  for (let d = 1; d <= 9; d++) {
    const bit = 1 << d;
    // Row base
    for (let r1 = 0; r1 < 9; r1++) {
      const c1s = [];
      for (let c = 0; c < 9; c++) if (grid[r1*9+c] === 0 && (cands[r1*9+c] & bit)) c1s.push(c);
      if (c1s.length !== 2) continue;
      for (let r2 = 0; r2 < 9; r2++) {
        if (r1 === r2) continue;
        const c2s = [];
        for (let c = 0; c < 9; c++) if (grid[r2*9+c] === 0 && (cands[r2*9+c] & bit)) c2s.push(c);
        if (c2s.length !== 3) continue;
        if (!c1s.every(c => c2s.includes(c))) continue;
        const finCol = c2s.find(c => !c1s.includes(c));
        const finCell = r2 * 9 + finCol;
        const finBox = CELL_BOX[finCell];
        const matchingCornerCol = c1s.find(c => CELL_BOX[r2 * 9 + c] === finBox);
        if (matchingCornerCol === undefined) continue;
        const patternCells = [
          r1 * 9 + c1s[0], r1 * 9 + c1s[1],
          r2 * 9 + c1s[0], r2 * 9 + c1s[1],
          finCell
        ];
        const elims = [];
        for (const c of BOXES[finBox]) {
          if (CELL_COL[c] === matchingCornerCol && CELL_ROW[c] !== r1 && CELL_ROW[c] !== r2 && grid[c] === 0 && (cands[c] & bit)) {
            elims.push({ cell: c, digit: d });
          }
        }
        if (elims.length > 0) {
          return {
            techniqueId: 'advanced_chains',
            subType: 'Finned X-Wing / Grouped Chain',
            digit: d,
            patternCells,
            roles: { [finCell]: 'fin' },
            eliminations: elims,
            regions: [{ type: 'row', index: r1 }, { type: 'row', index: r2 }, { type: 'col', index: matchingCornerCol }],
            links: [
              { fromCell: r1 * 9 + c1s[0], fromDigit: d, toCell: r1 * 9 + c1s[1], toDigit: d, type: 'strong' },
              { fromCell: r2 * 9 + c1s[0], fromDigit: d, toCell: finCell, toDigit: d, type: 'strong' }
            ],
            summary: `Patrón Complejo (Finned X-Wing / Cadena Agrupada) sobre el candidato ${d} en las Filas ${r1+1} y ${r2+1} con aleta (Fin) en ${cellName(finCell)}. Elimina ${d} en la intersección de la Columna ${matchingCornerCol+1} y la Región ${finBox+1}.`
          };
        }
      }
    }
  }
  return null;
}

const TECHNIQUE_ORDER = [
  { id: 'locked_candidates', fn: detectLockedCandidates },
  { id: 'naked_pairs', fn: detectNakedPairs },
  { id: 'hidden_pairs', fn: detectHiddenPairs },
  { id: 'naked_triples', fn: detectNakedTriples },
  { id: 'hidden_triples', fn: detectHiddenTriples },
  { id: 'x_wing', fn: (g, c) => detectFish(g, c, 2, 'x_wing', 'X-Wing') },
  { id: 'swordfish', fn: (g, c) => detectFish(g, c, 3, 'swordfish', 'Swordfish') },

    // =========================================================================
    // 3. AUTOMATIC 10-POINT MATHEMATICAL VALIDATOR (Uses solveAndCount)
    // =========================================================================
    function validateExerciseRecord(ex, expectedRank) {
      const grid = typeof ex.grid === 'string' ? ex.grid.split('').map(Number) : ex.grid.slice();
      const sol = typeof ex.solution === 'string' ? ex.solution.split('').map(Number) : ex.solution.slice();
      const cands = new Int32Array(ex.cands);
      const baseCands = initCandidates(grid);

      // 1. No conflicts in initial clues
      for (let i = 0; i < 81; i++) {
        if (grid[i] !== 0) {
          for (const p of PEERS[i]) {
            if (grid[p] === grid[i]) return { valid: false, reason: 'Contradicción en pistas iniciales' };
          }
        }
      }
      // 2. Initial clues match stored solution
      for (let i = 0; i < 81; i++) {
        if (grid[i] !== 0 && grid[i] !== sol[i]) {
          return { valid: false, reason: 'Las pistas no coinciden con la solución almacenada' };
        }
      }
      // 3. Stored solution is a valid complete 9x9 Sudoku
      for (const u of UNITS) {
        let mask = 0;
        for (const c of u.cells) mask |= (1 << sol[c]);
        if (mask !== 0x3FE) return { valid: false, reason: 'La solución almacenada no es un Sudoku válido' };
      }
      // 4. Board has strictly 1 unique solution via solveAndCount(grid, 2)
      const solved = solveAndCount(grid, 2);
      if (solved.count !== 1 || solved.solution.join('') !== sol.join('')) {
        return { valid: false, reason: `El tablero tiene ${solved.count} soluciones en lugar de solución única` };
      }
      // 5 & 6. Logical candidates are valid and no true candidate was eliminated
      for (let i = 0; i < 81; i++) {
        if (grid[i] !== 0) {
          if (cands[i] !== 0) return { valid: false, reason: 'Celda ocupada con candidatos no nulos' };
        } else {
          if ((cands[i] & (1 << sol[i])) === 0) return { valid: false, reason: 'Candidato de solución eliminado incorrectamente' };
          if ((cands[i] & ~baseCands[i]) !== 0) return { valid: false, reason: 'Candidato incompatible con pistas vecinas' };
          if (countBits(cands[i]) < 2) return { valid: false, reason: 'Naked Single presente antes de la técnica' };
        }
      }
      if (hasBasicSingles(grid, cands)) return { valid: false, reason: 'Single básico presente antes de la técnica' };
      for (let r = 0; r < expectedRank; r++) {
        if (TECHNIQUE_ORDER[r].fn(grid, cands)) {
          return { valid: false, reason: `Aplica antes una técnica más simple: ${TECHNIQUE_ORDER[r].id}` };
        }
      }
      // 7 & 8. Live detector identifies the technique and matches expected eliminations
      const liveStep = TECHNIQUE_ORDER[expectedRank].fn(grid, cands);
      if (!liveStep || !liveStep.eliminations || liveStep.eliminations.length === 0) {
        return { valid: false, reason: 'El detector en vivo devolvió null' };
      }
      for (const e of liveStep.eliminations) {
        if ((cands[e.cell] & (1 << e.digit)) === 0) return { valid: false, reason: 'Eliminación sobre candidato inexistente' };
        if (sol[e.cell] === e.digit) return { valid: false, reason: 'Eliminación inválida: borra el dígito de la solución' };
      }
      if (ex.step && ex.step.eliminations) {
        const keyLive = liveStep.eliminations.map(e => `${e.cell}:${e.digit}`).sort().join(',');
        const keyStored = ex.step.eliminations.map(e => `${e.cell}:${e.digit}`).sort().join(',');
        if (keyLive !== keyStored) {
          return { valid: false, reason: 'Discrepancia entre paso detectado en vivo y paso esperado' };
        }
      }
      // 9 & 10. Eliminations produce real immediate logical progress (unlocking a Single)
      const candsAfter = new Int32Array(cands);
      for (const e of liveStep.eliminations) candsAfter[e.cell] &= ~(1 << e.digit);
      if (!hasBasicSingles(grid, candsAfter)) {
        return { valid: false, reason: 'Las eliminaciones no producen desbloqueo inmediato verificable' };
      }
      return { valid: true, liveStep };
    }

    // Create a second distinct evaluation configuration for Stage E (Domina) by applying a valid digit/band isomorphism
    function createIsomorphicEvalExercise(baseEx, expectedRank) {
      const srcGrid = baseEx.grid.split('').map(Number);
      const srcSol = baseEx.solution.split('').map(Number);
      const srcCands = baseEx.cands.slice();
      const dMap = [0, 2, 3, 4, 5, 6, 7, 8, 9, 1];
      const rMap = [6, 7, 8, 3, 4, 5, 0, 1, 2];
      const newGrid = new Array(81).fill(0);
      const newSol = new Array(81).fill(0);
      const newCands = new Array(81).fill(0);
      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          const oldIdx = rMap[r] * 9 + c;
          const newIdx = r * 9 + c;
          newGrid[newIdx] = srcGrid[oldIdx] === 0 ? 0 : dMap[srcGrid[oldIdx]];
          newSol[newIdx] = dMap[srcSol[oldIdx]];
          let mask = 0;
          for (const d of bitsToDigits(srcCands[oldIdx])) mask |= (1 << dMap[d]);
          newCands[newIdx] = mask;
        }
      }
      const liveStep = TECHNIQUE_ORDER[expectedRank].fn(newGrid, new Int32Array(newCands));
      return {
        id: baseEx.id + '_domina_iso',
        techniqueId: baseEx.techniqueId,
        boardIndex: 3,
        role: 'domina_config_2',
        grid: newGrid.join(''),
        solution: newSol.join(''),
        cands: newCands,
        step: liveStep
      };
    }

    // Variantes de práctica: permutan filas dentro de bandas, bandas, columnas dentro
    // de pilas, pilas y dígitos. Son transformaciones Sudoku válidas, no tableros inventados.
    function createRandomPracticeExercise(baseEx, expectedRank, serial) {
      const shuffle = arr => {
        const a = arr.slice();
        for (let i=a.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
        return a;
      };
      const rowBands = shuffle([0,1,2]);
      const colStacks = shuffle([0,1,2]);
      const rowMap = [];
      const colMap = [];
      for (const band of rowBands) for (const inner of shuffle([0,1,2])) rowMap.push(band*3+inner);
      for (const stack of colStacks) for (const inner of shuffle([0,1,2])) colMap.push(stack*3+inner);
      const digits = shuffle([1,2,3,4,5,6,7,8,9]);
      const digitMap = [0, ...digits];
      const srcGrid=baseEx.grid.split('').map(Number), srcSol=baseEx.solution.split('').map(Number), srcCands=baseEx.cands;
      const grid=new Array(81).fill(0), solution=new Array(81).fill(0), cands=new Int32Array(81);
      for(let r=0;r<9;r++) for(let c=0;c<9;c++) {
        const oldIdx=rowMap[r]*9+colMap[c], newIdx=r*9+c;
        grid[newIdx]=srcGrid[oldIdx] ? digitMap[srcGrid[oldIdx]] : 0;
        solution[newIdx]=digitMap[srcSol[oldIdx]];
        let mask=0; for(const d of bitsToDigits(srcCands[oldIdx])) mask|=(1<<digitMap[d]);
        cands[newIdx]=mask;
      }
      const liveStep=TECHNIQUE_ORDER[expectedRank].fn(grid,new Int32Array(cands));
      return {id:`${baseEx.id}_reto_${serial}`,techniqueId:baseEx.techniqueId,boardIndex:serial,role:'practice_isomorphic_variant',grid:grid.join(''),solution:solution.join(''),cands,step:liveStep};
    }

  const p = prog(id); if (!p) return;
  if (p.learnedTheory && p.observedExample && p.guidedPracticeDone && p.evalBoardsSolved.length >= 2) { p.status = 'mastered'; p.masteryDone = true; }

  const boards = VERIFIED_LIBRARY[techId];

  const m = /^v(\d)_(\d+)$/.exec(ref);
